<meta charset="utf-8">
<title>Shqiponja</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: single centered column. Home = unit banners + zig-zag lesson path. Lesson = full-height screen: top bar, exercise, bottom check sheet. */
:root {
  --bg: #fbf8f6;
  --surface: #ffffff;
  --surface-2: #f2ece9;
  --line: #e4dcd8;
  --fg: #2a2122;
  --muted: #7d7172;
  --accent: #c8162f;          /* Albanian red */
  --accent-deep: #8f0f22;
  --accent-soft: #fbe3e6;
  --ink: #241c1d;             /* eagle black */
  --good: #3a9a46; --good-deep: #2a7434; --good-soft: #e3f4e4;
  --bad: #d43b3b; --bad-deep: #a32626; --bad-soft: #fde6e4;
  --gold: #f2a516; --gold-soft: #fff1d2;
  --blue: #2e7bd6;
  --f-display: "Fredoka", "Segoe UI Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  --f-body: "Lexend", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171314; --surface: #221c1d; --surface-2: #2d2627; --line: #3b3233; --fg: #f3eeed; --muted: #a99d9e;
    --accent: #f04a5f; --accent-deep: #a8182c; --accent-soft: #3c1b20; --ink: #f3eeed;
    --good: #5cc46a; --good-deep: #2f8a3b; --good-soft: #1b3320; --bad: #f06b6b; --bad-deep: #b23434; --bad-soft: #3f1d1d;
    --gold: #f5b73a; --gold-soft: #3a2d12; --blue: #5fa2ef; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171314; --surface: #221c1d; --surface-2: #2d2627; --line: #3b3233; --fg: #f3eeed; --muted: #a99d9e;
  --accent: #f04a5f; --accent-deep: #a8182c; --accent-soft: #3c1b20; --ink: #f3eeed;
  --good: #5cc46a; --good-deep: #2f8a3b; --good-soft: #1b3320; --bad: #f06b6b; --bad-deep: #b23434; --bad-soft: #3f1d1d;
  --gold: #f5b73a; --gold-soft: #3a2d12; --blue: #5fa2ef; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 17px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.app { max-width: 620px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
svg { display: block; }

/* chunky game buttons */
.btn {
  font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; letter-spacing: .04em; text-transform: uppercase;
  border-radius: 16px; padding: 14px 20px; background: var(--accent); color: #fff;
  box-shadow: 0 4px 0 var(--accent-deep); transition: transform .08s, box-shadow .08s; width: 100%;
}
.btn:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-deep); }
.btn[disabled] { background: var(--surface-2); color: var(--muted); box-shadow: 0 4px 0 var(--line); cursor: default; }
.btn.good { background: var(--good); box-shadow: 0 4px 0 var(--good-deep); }
.btn.bad { background: var(--bad); box-shadow: 0 4px 0 var(--bad-deep); }
.btn.ghost { background: var(--surface); color: var(--fg); box-shadow: 0 4px 0 var(--line); border: 2px solid var(--line); }

/* ---- Home ---- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px; border-bottom: 2px solid var(--line);
}
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; color: var(--accent); }
.stats { display: flex; gap: 14px; align-items: center; font-family: var(--f-display); font-weight: 600; font-variant-numeric: tabular-nums; }
.stats span { display: flex; align-items: center; gap: 4px; }
.s-fire { color: var(--gold); } .s-xp { color: var(--blue); } .s-heart { color: var(--bad); }

.goal { display: flex; gap: 14px; align-items: center; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 12px 16px; margin-top: 16px; }
.goal .txt { flex: 1; min-width: 0; }
.goal b { font-family: var(--f-display); font-size: 1.1rem; }
.goal .sub { color: var(--muted); font-size: .9rem; }
.gbar { height: 12px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.gbar i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .4s; }

.unit { margin-top: 22px; }
.unit-head {
  background: var(--accent); color: #fff; border-radius: 18px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  box-shadow: 0 4px 0 var(--accent-deep);
}
.unit-head.locked { background: var(--surface-2); color: var(--muted); box-shadow: 0 4px 0 var(--line); }
.unit-head .k { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; opacity: .85; font-weight: 600; }
.unit-head h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; margin: 0; }
.unit-head .peek { font-size: .88rem; opacity: .9; text-align: right; }
.path { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-block: 22px 6px; }
.node-wrap { position: relative; display: flex; flex-direction: column; align-items: center; }
.node {
  width: 74px; height: 70px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff;
  box-shadow: 0 6px 0 var(--accent-deep); transition: transform .08s, box-shadow .08s; font-family: var(--f-display); font-weight: 700; font-size: 1.3rem;
}
.node:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-deep); }
.node.done { background: var(--gold); box-shadow: 0 6px 0 #b77a06; }
.node.locked { background: var(--surface-2); color: var(--muted); box-shadow: 0 6px 0 var(--line); cursor: default; }
.node.current { outline: 6px solid var(--accent-soft); }
.bubble {
  position: absolute; bottom: calc(100% + 10px); background: var(--surface); border: 2px solid var(--line); color: var(--accent);
  font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 6px 12px; border-radius: 12px; white-space: nowrap;
  animation: bob 1.4s ease-in-out infinite;
}
.bubble::after { content: ""; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); border: 8px solid transparent; border-top-color: var(--line); }
@keyframes bob { 50% { transform: translateY(-4px); } }
.mascot-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 4px; }
.foot { color: var(--muted); font-size: .85rem; text-align: center; padding-block: 28px; max-width: 52ch; margin: 0 auto; }

/* ---- Lesson ---- */
.lesson { min-height: 100%; display: flex; flex-direction: column; }
.l-top { display: flex; align-items: center; gap: 12px; padding-block: 14px; }
.l-top .x { width: 40px; height: 40px; display: grid; place-items: center; color: var(--muted); border-radius: 10px; }
.l-prog { flex: 1; height: 16px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.l-prog i { display: block; height: 100%; background: var(--good); border-radius: 99px; transition: width .35s; box-shadow: inset 0 -4px 0 rgba(0,0,0,.08); }
.hearts { display: flex; align-items: center; gap: 4px; color: var(--bad); font-family: var(--f-display); font-weight: 700; }
.l-body { flex: 1; display: flex; flex-direction: column; gap: 18px; padding-block: 8px 24px; }
.prompt { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; margin: 0; text-wrap: balance; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.tag.new { color: var(--blue); }
.speak-row { display: flex; align-items: center; gap: 14px; }
.speaker {
  width: 72px; height: 72px; border-radius: 20px; background: var(--blue); color: #fff; display: grid; place-items: center; flex: none;
  box-shadow: 0 5px 0 #1f5aa0;
}
.speaker.sm { width: 52px; height: 52px; border-radius: 14px; }
.speaker:active { transform: translateY(3px); box-shadow: 0 2px 0 #1f5aa0; }
.slow { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); color: var(--blue); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: .8rem; }
.bubble-say { position: relative; border: 2px solid var(--line); border-radius: 16px; padding: 12px 16px; font-size: 1.2rem; font-weight: 600; background: var(--surface); min-width: 0; overflow-wrap: anywhere; }

.intro { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 22px 16px; border: 2px solid var(--line); border-radius: 22px; background: var(--surface); }
.intro .sq { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.8rem, 7vw, 2.6rem); color: var(--accent); overflow-wrap: anywhere; }
.intro .tr { font-size: 1.2rem; color: var(--muted); }

.pic { display: grid; place-items: center; line-height: 1; }
.pic.emoji { font-size: 64px; }
.pic.big.emoji { font-size: 96px; }
.pic .sw { width: 64px; height: 64px; border-radius: 16px; border: 2px solid var(--line); }
.pic.big .sw { width: 110px; height: 110px; border-radius: 24px; }
.pic .num { font-family: var(--f-display); font-weight: 700; font-size: 46px; color: var(--blue); font-variant-numeric: tabular-nums; }
.pic.big .num { font-size: 80px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opt {
  border: 2px solid var(--line); border-radius: 18px; background: var(--surface); padding: 14px; box-shadow: 0 4px 0 var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; min-width: 0;
  font-weight: 600; overflow-wrap: anywhere; transition: transform .08s;
}
.opt.row { flex-direction: row; justify-content: flex-start; text-align: left; padding: 14px 16px; }
.opt:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.opt.sel { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, var(--surface)); box-shadow: 0 4px 0 var(--blue); }
.opt.ok { border-color: var(--good); background: var(--good-soft); box-shadow: 0 4px 0 var(--good); color: var(--good-deep); }
.opt.no { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 4px 0 var(--bad); color: var(--bad-deep); }
.opt.gone { opacity: .35; pointer-events: none; }
.opt .num-k { width: 26px; height: 26px; border: 2px solid var(--line); border-radius: 8px; display: grid; place-items: center; font-size: .8rem; color: var(--muted); flex: none; }
.list { display: flex; flex-direction: column; gap: 10px; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

.answer-line { min-height: 64px; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; padding-bottom: 10px; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tile { border: 2px solid var(--line); border-radius: 12px; padding: 8px 14px; background: var(--surface); box-shadow: 0 3px 0 var(--line); font-weight: 600; }
.tile.used { color: transparent; background: var(--surface-2); box-shadow: none; pointer-events: none; }
textarea {
  width: 100%; min-height: 110px; resize: vertical; border: 2px solid var(--line); border-radius: 16px; background: var(--surface-2);
  font: inherit; font-size: 1.15rem; padding: 14px; color: var(--fg);
}
.keys { display: flex; gap: 8px; flex-wrap: wrap; }
.keys button { border: 2px solid var(--line); border-radius: 10px; padding: 6px 14px; font-weight: 700; background: var(--surface); }

.sheet {
  position: sticky; bottom: 0; margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  border-top: 2px solid var(--line); background: var(--bg); display: flex; flex-direction: column; gap: 12px;
}
.sheet.ok { background: var(--good-soft); border-color: transparent; }
.sheet.no { background: var(--bad-soft); border-color: transparent; }
.sheet .fb { display: flex; gap: 12px; align-items: center; }
.sheet .fb .ic { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); flex: none; }
.sheet.ok .fb { color: var(--good-deep); } .sheet.no .fb { color: var(--bad-deep); }
.sheet .fb b { font-family: var(--f-display); font-size: 1.35rem; display: block; }
.sheet .fb span { font-size: 1rem; overflow-wrap: anywhere; }
:root[data-theme="dark"] .sheet.ok .fb, :root[data-theme="dark"] .sheet.no .fb { color: var(--fg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sheet.ok .fb, :root:not([data-theme="light"]) .sheet.no .fb { color: var(--fg); } }

.end { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding-block: 24px; }
.end h2 { font-family: var(--f-display); font-size: 2rem; margin: 0; color: var(--gold); }
.end h2.fail { color: var(--bad); }
.end-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.es { border: 2px solid; border-radius: 16px; overflow: hidden; }
.es .h { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #fff; padding: 4px; }
.es .v { font-family: var(--f-display); font-size: 1.5rem; font-weight: 700; padding: 10px 4px; background: var(--surface); font-variant-numeric: tabular-nums; }
.es.x { border-color: var(--gold); } .es.x .h { background: var(--gold); } .es.x .v { color: var(--gold); }
.es.a { border-color: var(--good); } .es.a .h { background: var(--good); } .es.a .v { color: var(--good); }
.es.t { border-color: var(--blue); } .es.t .h { background: var(--blue); } .es.t .v { color: var(--blue); }
.pop { animation: pop .35s ease-out; }
@keyframes pop { 0% { transform: scale(.9); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }
.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.loading { padding: 40px 0; text-align: center; color: var(--muted); }

/* ---- Bottom nav + tabs ---- */
.view { flex: 1; padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
nav.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--bg); border-top: 2px solid var(--line);
  display: flex; justify-content: center; padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
nav.bottom .in { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; width: 100%; max-width: 620px; }
nav.bottom button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; color: var(--muted); font-size: .78rem; font-weight: 600; position: relative; }
nav.bottom button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
nav.bottom .badge { position: absolute; top: 2px; right: calc(50% - 22px); background: var(--bad); color: #fff; border-radius: 99px; font-size: .68rem; padding: 0 6px; font-variant-numeric: tabular-nums; }
.unit-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-weight: 600; font-size: .9rem; color: var(--fg); text-decoration: none; }
.chip.yt { color: var(--accent); }
.tipbox { margin-top: 10px; background: var(--gold-soft); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: .95rem; }
.tipbox b { color: var(--accent); }
.section-h { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; margin: 18px 0 4px; }
.lead { color: var(--muted); margin: 0 0 12px; max-width: 60ch; }
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.big-num { font-family: var(--f-display); font-weight: 700; font-size: 3rem; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
.boxes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.boxes div { background: var(--surface-2); border-radius: 10px; padding: 6px 2px; text-align: center; font-size: .72rem; color: var(--muted); }
.boxes b { display: block; font-family: var(--f-display); font-size: 1.15rem; color: var(--fg); font-variant-numeric: tabular-nums; }
.story-list { display: flex; flex-direction: column; gap: 10px; }
.story-card { display: flex; gap: 14px; align-items: center; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 14px; box-shadow: 0 4px 0 var(--line); }
.story-card .ic { width: 52px; height: 52px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.story-card .t { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; }
.story-card .s { color: var(--muted); font-size: .88rem; }
.story-card.done .ic { background: var(--gold-soft); color: var(--gold); }
.lines { display: flex; flex-direction: column; gap: 10px; }
.line { display: flex; gap: 10px; align-items: flex-start; }
.line .who { font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.line .txt { flex: 1; min-width: 0; border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; background: var(--surface); text-align: left; }
.line .txt .sq { font-weight: 600; font-size: 1.08rem; }
.line .txt .tr { color: var(--tr, var(--muted)); font-size: .92rem; color: var(--muted); }
.line.playing .txt { border-color: var(--blue); }
.line .speaker { width: 44px; height: 44px; border-radius: 12px; box-shadow: 0 3px 0 #1f5aa0; }
.line .speaker svg { width: 22px; height: 22px; }
.alpha { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.letter { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px; box-shadow: 0 3px 0 var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.letter.d { border-color: var(--accent); box-shadow: 0 3px 0 var(--accent-deep); }
.letter .L { font-family: var(--f-display); font-weight: 700; font-size: 1.7rem; color: var(--accent); line-height: 1.1; }
.letter .say { font-weight: 600; }
.letter .ex { color: var(--muted); font-size: .86rem; overflow-wrap: anywhere; }
.shadow-steps { display: flex; flex-direction: column; gap: 8px; color: var(--muted); font-size: .95rem; }
.tipbox[hidden] { display: none; }
.hw { border-bottom: 2px dashed color-mix(in srgb, var(--muted) 60%, transparent); cursor: pointer; }
.hw:hover { border-bottom-color: var(--blue); }
.hint-pop { position: absolute; z-index: 50; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.15);
  display: flex; flex-direction: column; min-width: 120px; max-width: 260px; overflow: hidden; font-size: .98rem; }
.hint-pop b { padding: 8px 14px; background: var(--surface-2); font-family: var(--f-display); }
.hint-pop span { padding: 8px 14px; border-top: 2px solid var(--line); }
.gap { display: inline-block; min-width: 4em; border-bottom: 3px solid var(--blue); color: var(--blue); text-align: center; }
.sub-tr { color: var(--muted); font-size: .9rem; font-weight: 400; margin-top: 6px; }
.vgroup { font-family: var(--f-display); font-size: 1.1rem; margin: 18px 0 8px; color: var(--accent); }
.vrow { display: flex; gap: 10px; align-items: stretch; margin-bottom: 8px; }
.vchk { display: grid; place-items: center; width: 44px; flex: none; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; }
.vchk input { width: 22px; height: 22px; accent-color: var(--good); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.vmain { flex: 1; min-width: 0; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; text-decoration: none; color: var(--fg);
  border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; background: var(--surface); }
.vmain .vn { grid-row: span 2; font-family: var(--f-display); font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 1.6em; }
.vmain .vt { font-weight: 600; overflow-wrap: anywhere; }

const app = document.getElementById("app");
Promise.all([fetch("data.json").then(r => r.json()), fetch("icons.json").then(r => r.json()).catch(() => ({}))]).then(([d, ic]) => {
  ICONS = ic;
  UNITS = d.units; STORIES = d.stories; ALPHA = d.alpha; PAIRS = d.pairs || []; EXTRA = d.extra || []; GLOSS = d.gloss; REV = d.rev; ROLES = d.roles || []; CONJ = d.conj || null; GRAM = d.gram || []; FREQ = d.freq || []; MODS = d.mods || []; PATS = d.pats || []; NUMS = d.nums || []; GOAL = ({ 5: 15, 10: 20, 15: 30, 20: 40 })[(P.profile || {}).min] || 30;
  UNITS.forEach((u, ui) => {
    u.w.forEach(w => w.u = u.id);
    const n = Math.ceil(u.w.length / 5), size = Math.ceil(u.w.length / n);
    u.lessons = [];
    for (let i = 0; i < n; i++) {
      const L = { id: u.id + "-" + i, unit: u, ui, li: i, words: u.w.slice(i * size, (i + 1) * size) };
      u.lessons.push(L); LESSONS.push(L);
    }
  });
  try { const h = location.hash.slice(1); if (["learn", "review", "stories", "sounds", "grammar"].includes(h)) TAB = h; } catch {}
  home();
  if (!P.profile && !Object.keys(P.done).length) onboarding();
}).catch(() => { app.innerHTML = '<p class="loading">Ders verisi yüklenemedi. Sayfayı yenile.</p>'; });

const isDone = L => !!P.done[L.id];
const unlockedIndex = () => { const i = LESSONS.findIndex(L => !isDone(L)); return i < 0 ? LESSONS.length - 1 : i; };
const unitDone = id => UNITS.find(u => u.id === id).lessons.every(isDone);

/* ---------- Home shell with tabs ---------- */
function home(tab) {
  if (tab) { TAB = tab; try { history.replaceState(null, "", "#" + tab); } catch {} }
  if (curAudio) curAudio.pause();
  const streakAlive = P.last === today() || P.last === new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  const streak = streakAlive ? P.streak : 0;
  app.replaceChildren();
  app.append($(`<header class="topbar">
    <div class="logo">${eagle(34)}Shqiponja</div>
    <div class="stats"><span class="s-fire" title="Günlük seri">${I.fire}${streak}</span><span class="s-xp" title="Toplam XP">${I.xp}${P.xp}</span><button class="gear" aria-label="Ayarlar">${I.gear}</button></div>
  </header>`));
  app.querySelector(".gear").onclick = openSettings;
  const view = $(`<div class="view"></div>`); app.append(view);
  ({ learn: learnTab, review: reviewTab, stories: storiesTab, sounds: soundsTab, grammar: grammarTab })[TAB](view);
  const due = dueWords().length;
  const nav = $(`<nav class="bottom" aria-label="Bölümler"><div class="in">
    <button data-t="learn">${I.path}Öğren</button>
    <button data-t="review">${I.repeat}Tekrar${due ? `<span class="badge">${due}</span>` : ""}</button>
    <button data-t="stories">${I.book}Hikâyeler</button>
    <button data-t="sounds">${I.ear}Telaffuz</button>
    <button data-t="grammar">${I.table}Gramer</button></div></nav>`);
  nav.querySelectorAll("button").forEach(b => {
    if (b.dataset.t === TAB) b.setAttribute("aria-current", "page");
    b.onclick = () => { sfx.tap(); home(b.dataset.t); window.scrollTo({ top: 0 }); };
  });
  app.append(nav);
}

function goalCard() {
  const pct = Math.min(100, Math.round(P.dayXp / GOAL * 100));
  return $(`<div class="goal">${eagle(56)}<div class="txt"><b>${P.dayXp >= GOAL ? "Günlük hedef tamam!" : "Günlük hedef"}</b>
    <div class="sub">${Math.min(P.dayXp, GOAL)} / ${GOAL} XP · ders 10, tekrar 5, hikâye 10 XP</div><div class="gbar"><i style="width:${pct}%"></i></div></div></div>`);
}

function startReview(words) {
  const ws = shuffle(words).slice(0, 12);
  const steps = ws.map(w => ({ k: pickOne(typesFor(w, true)), w }));
  if (ws.length >= 4) steps.splice(Math.min(4, steps.length), 0, { k: "match", ws: ws.slice(0, 5) });
  preload(ws.map(w => w.a));
  LS = { L: null, review: true, steps, i: 0, hearts: 5, total: steps.length, right: 0, tries: 0, t0: Date.now(), practice: true, redo: [] };
  renderStep();
}

let storyPlay = null;
function openStory(s, skipPrep) {

  preload(s.lines.map(l => l.a)); loadPack("s-" + s.id, true);
  if (curAudio) curAudio.pause();
  app.replaceChildren();
  const el = $(`<div class="lesson">
    <div class="l-top"><button class="x" aria-label="Kapat">${I.x}</button><div style="flex:1;font-family:var(--f-display);font-weight:700;font-size:1.2rem">${esc(s.t)}</div></div>
    <div class="l-body">
      <div class="unit-tools" style="margin:0;justify-content:center"><button class="chip" id="play-all">${I.play}Tümünü dinle</button><button class="chip" id="show-tr">Çevirileri göster</button><button class="chip" id="listen-first" aria-pressed="false">Önce dinle</button><button class="chip" id="film">${icon("🎬")}Film izle</button>${s.pre && s.pre.length ? `<button class="chip" id="newwords">Yeni kelimeler (${s.pre.length})</button>` : ""}</div>
      <div class="prelist" hidden>${(s.pre || []).map(x => `<span><b>${esc(x.sq)}</b> ${esc(x.tr)}</span>`).join("")}</div>
      <div class="lines"></div>
    </div>
    <div class="sheet"><button class="btn">Anladım, sorulara geç</button></div></div>`);
  const lines = el.querySelector(".lines");
  const speakers = [...new Set(s.lines.filter(l => l.who).map(l => l.who))];
  const scene = storyScene(s, speakers);
  el.querySelector(".l-body").prepend(scene.el);
  let showAll = false;
  const rows = s.lines.map(l => {
    const side = l.who ? (speakers.indexOf(l.who) % 2 ? "right" : "left") : "narr";
    const r = $(`<div class="line ${side}">${l.av ? `<div class="av" aria-hidden="true">${l.av}</div>` : ""}<button class="speaker sm" aria-label="Dinle">${I.speaker}</button>
      <div class="txt" role="button" tabindex="0">${l.who ? `<div class="who">${esc(l.who)}</div>` : ""}<div class="sq">${kara(l)}</div><div class="tr" hidden>${esc(l.tr)}</div></div></div>`);
    const sayLine = () => { scene.show(l); const pr = say(l, false, maleVoice(l)); if (pr) pr.then(au => au && au.addEventListener("ended", () => scene.quiet(), { once: true })); };
    r.querySelector(".speaker").onclick = sayLine;
    r.querySelector(".txt").onclick = e => { if (e.target.closest(".hw")) return; const t = r.querySelector(".tr"); t.hidden = !t.hidden; sayLine(); };
    lines.append(r); return r;
  });
  el.querySelector(".x").onclick = () => { stopStory(); home(); };
  el.querySelector("#film").onclick = () => { stopStory(); openFilm(s); };
  const nw = el.querySelector("#newwords"); if (nw) nw.onclick = () => { const pl = el.querySelector(".prelist"); pl.hidden = !pl.hidden; };
  el.querySelector("#show-tr").onclick = e => { showAll = !showAll; rows.forEach(r => r.querySelector(".tr").hidden = !showAll); e.currentTarget.textContent = showAll ? "Çevirileri gizle" : "Çevirileri göster"; };
  if (s.kind === "text") setTimeout(() => { const lf = el.querySelector("#listen-first"); if (lf && lf.getAttribute("aria-pressed") !== "true") lf.click(); }, 0);
  el.querySelector("#listen-first").onclick = e => { const on = lines.classList.toggle("blind"); e.currentTarget.setAttribute("aria-pressed", String(on)); e.currentTarget.textContent = on ? "Metni göster" : "Önce dinle"; };
  el.querySelector("#play-all").onclick = () => {
    stopStory(); let i = 0; storyPlay = true;
    const next = () => {
      rows.forEach(r => r.classList.remove("playing"));
      if (!storyPlay || i >= s.lines.length) { storyPlay = null; scene.quiet(); return; }
      const r = rows[i], l = s.lines[i]; r.classList.add("playing"); r.scrollIntoView({ block: "nearest", behavior: "smooth" });
      scene.show(l);

    };

  app.append(el);
}
function stopStory() { storyPlay = null; if (curAudio) curAudio.pause(); }
function storyQuiz(s, qi, right) {

    app.replaceChildren();

      <p style="margin:0;color:var(--muted)">${right} / ${s.q.length} soru doğru · +${xp} XP</p></div>
      <div class="sheet"><button class="btn good">Devam</button></div></div>`);
    el.querySelector(".btn").onclick = () => home("stories"); app.append(el); celebrate(el.querySelector(".end"), xp, false); return;
  }
  const q = s.q[qi];
  app.replaceChildren();
  const el = $(`<div class="lesson"><div class="l-top"><button class="x" aria-label="Kapat">${I.x}</button>
    <div class="l-prog"><i style="width:${Math.round(qi / s.q.length * 100)}%"></i></div></div>
    <div class="l-body"><div class="tag">Anlama sorusu · ${esc(s.t)}</div><h2 class="prompt">${esc(q.q)}</h2><div class="list"></div></div>
    <div class="sheet"><button class="btn" disabled>Kontrol et</button></div></div>`);

/* ---------- Lesson engine ---------- */
let LS = null;
/* Lesson flow (research-based): introduce in context → recognise by ear → recall/build → produce → spaced review */
const multi = w => w.sq.replace(/[?!.,…]/g, "").trim().includes(" ");
const spellable = w => !multi(w) && w.sq.replace(/[?!.,…]/g, "").length <= 13;
function recallKind(w) { return multi(w) && w.sq.split(" ").length <= 7 ? "build" : spellable(w) && Math.random() < .6 ? "spell" : "toSq"; }
function typesFor(w, review = false) {
  // used by review sessions: retrieval-heavy, production-leaning
  if (!w.a) return spellable(w) ? ["toSq", "toTr", "spell"] : ["toSq", "toTr"];        // notebook word without audio
  const r = P.srs[w.sq], strong = r && r.s >= 3;
  const prod = multi(w) && w.sq.split(" ").length <= 7 ? "build" : spellable(w) ? "spell" : "toSq";
  const t = strong ? [prod, prod, prod, "dictate", "listen"] : ["listen", prod, recallKind(w), "dictate"];
  if (fillable(w)) t.push("fill");
  if (review) t.push("speak");
  return t;
}
function startLesson(L) {
  const practice = isDone(L);
  const words = L.words;
  const prev = LESSONS.slice(0, LESSONS.indexOf(L)).flatMap(x => x.words);
  const dueOld = dueWords().filter(w => prev.includes(w));
  const review = (dueOld.length ? shuffle(dueOld) : shuffle(prev)).slice(0, Math.min(3, prev.length));
  const steps = [];
  const pat = PATS.find(x => x.unit === L.unit.id);
  if (pat && L.li === 0 && !practice) steps.push({ k: "teach", p: pat });
  else if ((L.li === 0 || (pat && L.li === 1)) && !P.tipsSeen[L.unit.id + ":tip"] && (L.unit.tips || []).length) steps.push({ k: "tip", u: L.unit });
  // 1. introduce each new item, immediately followed by hearing it again (recognition)
  let held = null;
  words.forEach(w => {
    if (!practice && !P.seen[w.sq]) steps.push({ k: "intro", w });
    if (held) steps.push(held);
    held = { k: "listen", w };
  });
  if (held) steps.push(held);
  // 2. consolidate the set; where the unit has a picture scene, find the new words in it (place + picture + sound)
  if (words.length >= 3) steps.push({ k: "match", ws: words.slice(0, 5) });
  // the unit's grammar pattern: practised in full sentences with a targeted gap (2–3 per lesson, rotating)
  if (pat) { const ds = pat.drills, n = L.li === 0 ? 3 : 2; for (let i = 0; i < n; i++) steps.push({ k: "gap", d: ds[(L.li * 2 + i) % ds.length], p: pat }); }
  // 3. recall: Turkish → Albanian (build the sentence or choose the word), fill the gap where possible
  shuffle(words).forEach(w => steps.push({ k: recallKind(w), w }));
  const gap = words.filter(fillable);
  if (gap.length) steps.push({ k: "fill", w: pickOne(gap) });
  // 4. produce: shadow one item aloud, write one from dictation
  const prod = shuffle(words);
  if (prod[0]) steps.push({ k: "speak", w: prod[0] });
  if (prod[1]) steps.push({ k: "dictate", w: prod[1] });
  // 5. spaced review of earlier items that are due
  review.forEach(w => steps.push({ k: pickOne(["listen", recallKind(w), "dictate"]), w }));
  preload([...words, ...review].map(w => w.a));
  LS = { L, steps, i: 0, hearts: 5, total: steps.length, right: 0, tries: 0, t0: Date.now(), practice, redo: [] };
  renderStep();
}
const pickOne = a => a[Math.random() * a.length | 0];
const unitHasPics = u => u.w.filter(w => w.p).length >= 4;
function distractors(w, field, n = 3) {
  const same = w.u ? UNITS.find(u => u.id === w.u).w : [];
  let pool = same.filter(x => x[field] !== w[field]);
  if (pool.length < n) pool = pool.concat(UNITS.flatMap(u => u.w).filter(x => x[field] !== w[field] && !pool.includes(x)));
  return pick(pool, n);
}

function build(st, ui, byEar = false) {

  const pool = [...new Set([...near, ...allWords().flatMap(strip)])].filter(t => !target.includes(t));
  const extra = [...pick(pool.filter(t => near.includes(t)), 2), ...pick(pool, 4)].filter((t, i, a) => a.indexOf(t) === i).slice(0, Math.max(3, 8 - target.length));
  const tiles = shuffle([...target, ...extra]);
  if (byEar) {
    ui.body.append($(`<div class="tag">Duyduğunu kur</div>`));
    ui.body.append($(`<h2 class="prompt">Dinle ve kelimeleri sırayla seç</h2>`));

    if (target.length >= 3) ui.body.append($(`<button class="mirror-tip" type="button">${icon("🪞")} Ayna ipucu</button>`));
    ui.body.append($(`<div class="speak-row">${w.p || P.img[w.sq] ? picW(w) : eagle(64)}<div class="bubble-say">${hint(w.tr, "tr")}</div></div>`));
  }
  const line = $(`<div class="answer-line" aria-label="Cevabın"></div>`);
  const bank = $(`<div class="bank"></div>`);
  const chosen = [];
  tiles.forEach((t, i) => {
    const tb = $(`<button class="tile">${esc(t)}</button>`);
    tb.onclick = () => {
      sfx.tap(); tb.classList.add("used");
      const ub = $(`<button class="tile">${esc(t)}</button>`);
      chosen.push({ t, ub, tb });
      ub.onclick = () => { ub.remove(); tb.classList.remove("used"); chosen.splice(chosen.findIndex(c => c.ub === ub), 1); ui.btn.disabled = !chosen.length; };
      line.append(ub); ui.btn.disabled = false;
    };
    bank.append(tb);
  });
  ui.body.append(line, bank);
  const mt = ui.body.querySelector(".mirror-tip");
  if (mt) mt.onclick = () => { mt.outerHTML = `<div class="tipbox"><div>${icon("🪞")} Arnavutça çoğu zaman Türkçenin <b>aynası</b>dır: Türkçe cümleyi <b>sondan başa</b> düşün. Fiil öne gelir, ekler küçük kelimeler olarak kelimenin <b>önüne</b> geçer.</div></div>`; };
  ui.btn.onclick = () => {

    const ok = norm(chosen.map(c => c.t).join(" ")) === norm(target.join(" "));
    resolve(ui, ok, w.sq, st);
  };
}

/* ---------- Tap-to-translate hints ---------- */
const TOK = /([\p{L}'’]+)/u;
function lookup(words, i, dict) {
  // try two-word phrases first ("e madhe", "u ul"), then single words
  if (i + 1 < words.length) { const two = (words[i] + " " + words[i + 1]).toLowerCase(); if (dict[two]) return [two, 2]; }
  const one = words[i].toLowerCase().replace(/’/g, "'");
  if (dict[one]) return [one, 1];
  if (dict === GLOSS) { // strip common definite endings: libri -> libër is not derivable, but shtëpia -> shtëpi is
    for (const suf of ["a", "ja", "i", "u", "in", "në", "t", "ve"]) if (one.endsWith(suf) && dict[one.slice(0, -suf.length)]) return [one.slice(0, -suf.length), 1];
  }
  return null;
}
function hint(text, lang) {
  const dict = lang === "sq" ? GLOSS : REV;
  const parts = text.split(TOK);       // odd indexes are words
  const words = [], idx = [];
  parts.forEach((p, k) => { if (k % 2) { words.push(p); idx.push(k); } });
  let out = parts.map(esc);
  for (let i = 0; i < words.length; i++) {
    const hit = lookup(words, i, dict);
    if (!hit) continue;
    const [key, n] = hit, g = dict[key];
    if (n === 2) { out[idx[i]] = `<span class="hw" data-g="${esc(g)}">${esc(words[i])}${parts[idx[i] + 1] ? esc(parts[idx[i] + 1]) : " "}${esc(words[i + 1])}</span>`; out[idx[i] + 1] = ""; out[idx[i + 1]] = ""; i++; }
    else out[idx[i]] = `<span class="hw" data-g="${esc(g)}">${esc(words[i])}</span>`;
  }
  return out.join("");
}

      const row = $(`<div class="grid2"><button class="btn ghost">${esc(t.pr[0].sq)} ▶</button><button class="btn ghost">${esc(t.pr[1].sq)} ▶</button></div>`);
      row.children[0].onclick = () => say(t.pr[0]); row.children[1].onclick = () => say(t.pr[1]);
      const nb = $(`<button class="btn ${ok ? "good" : "bad"}">Devam</button>`);
      sheet.append(row, nb); nb.focus();
      nb.onclick = () => { i++; step(); };
    };
    app.append(el);
    setTimeout(() => play(t), 250);
  };

/* grammar cells: play the clip if the phrase exists in the course, otherwise nothing */
function playTTSFallback(text) {
  const key = text.toLowerCase().replace(/[.!?]/g, "").trim();
  const w = [...allWords(), ...EXTRA].find(x => x.sq.toLowerCase().replace(/[.!?]/g, "").trim() === key) || STORIES.flatMap(s => s.lines).find(x => x.sq.toLowerCase().replace(/[.!?]/g, "").trim() === key);
  if (w) say(w); else sfx.tap();
}

/* ---------- Review stats: memory strength + activity calendar ---------- */
function statsPanel() {
  const rs = Object.values(P.srs).filter(r => r.s);
  const buckets = [["< 1 gün", 0, 1], ["1–3 gün", 1, 3], ["3–7 gün", 3, 7], ["1–3 hafta", 7, 21], ["3 hafta +", 21, 1e9]];
  const counts = buckets.map(([, a, b]) => rs.filter(r => r.s >= a && r.s < b).length), max = Math.max(1, ...counts);
  const avgR = rs.length ? Math.round(rs.reduce((a, r) => a + recall(r), 0) / rs.length * 100) : 0;
  const days = []; for (let i = 34; i >= 0; i--) { const d = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10); days.push([d, (P.log || {})[d] || 0]); }
  return $(`<div class="panel" style="margin-top:14px">
    <div style="display:flex;gap:16px;align-items:center"><div class="big-num" style="color:var(--good)">${avgR}%</div><div><b>ortalama hatırlama olasılığı</b><div class="sub">FSRS hafıza modeline göre, şu an</div></div></div>
    <div><b style="font-size:.9rem">Hafıza gücü (kelime kaç gün akılda kalır)</b>
      <div class="strength">${buckets.map(([l], i) => `<div class="sb"><span class="sv">${counts[i]}</span><span class="sbar" style="height:${Math.round(counts[i] / max * 70) + 4}px;background:hsl(${120 * i / 4} 60% 45%)"></span><span class="sl">${l}</span></div>`).join("")}</div></div>
    ${coverageHTML()}
    <div><b style="font-size:.9rem">Son 5 hafta</b><div class="cal35">${days.map(([d, v]) => `<i title="${d}: ${v} XP" style="opacity:${v ? Math.min(1, .3 + v / 40) : 1};background:${v ? "var(--good)" : "var(--surface-2)"}"></i>`).join("")}</div></div>
  </div>`);
}

/* ---------- Celebration: confetti, the eagle jumps, the XP flies ---------- */
function celebrate(host, xp, goalHit) {
  if (!host || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  host.style.position = "relative";
  const c = document.createElement("canvas"); c.className = "confetti"; host.append(c);
  const r = host.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = r.width * dpr; c.height = r.height * dpr; const ctx = c.getContext("2d"); ctx.scale(dpr, dpr);
  const cols = ["#c8162f", "#f2a516", "#2e7bd6", "#3a9a46", "#2a2122"], n = goalHit ? 180 : 100;
  const ps = Array.from({ length: n }, () => ({ x: r.width / 2 + (Math.random() - .5) * 60, y: r.height * .3, vx: (Math.random() - .5) * 10, vy: -Math.random() * 10 - 3, s: Math.random() * 7 + 4, c: cols[Math.random() * 5 | 0], a: Math.random() * 6 }));
  let f = 0;
  const step = () => { ctx.clearRect(0, 0, r.width, r.height); ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .24; p.vx *= .99; p.a += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }); if (++f < 150) requestAnimationFrame(step); else c.remove(); };
  step();
  const e = host.querySelector(".pop"); if (e) { e.classList.remove("jump"); void e.offsetWidth; e.classList.add("jump"); }
  const fly = $(`<div class="xp-fly">+${xp} XP</div>`); host.append(fly); setTimeout(() => fly.remove(), 1600);
  if (goalHit) {
    const g = $(`<div class="goal-hit">${icon("🔥")}<b>Günlük hedef tamam!</b><span>${GOAL} XP'ye ulaştın. Yarın da gel, serin büyüsün.</span></div>`);
    host.prepend(g);
    setTimeout(() => tone([[523, .12, "triangle"], [659, .12, "triangle"], [784, .12, "triangle"], [1047, .12, "triangle"], [1319, .5, "triangle"]]), 500);
  }
}

function verbDrill() {
  const T = CONJ.tenses, lab = ["unë", "ti", "ai/ajo", "ne", "ju", "ata"];
  const trials = Array.from({ length: 10 }, () => { const v = pickOne(CONJ.verbs.slice(0, 26)), t = pickOne(T.slice(0, 3)), p = Math.random() * 6 | 0; return { v, t, p }; });
  let i = 0, right = 0;
  const step = () => {
    if (i >= trials.length) {
      const xp = 5; P.xp += xp; P.dayXp += xp; logDay(xp); bumpStreak(); save(); sfx.win(); app.replaceChildren();
      const el = $(`<div class="lesson"><div class="end"><div class="pop">${eagle(130)}</div><h2>Fiil antrenmanı bitti</h2><p style="margin:0;color:var(--muted)">${right} / ${trials.length} doğru · +${xp} XP</p></div><div class="sheet"><button class="btn good">Devam</button></div></div>`);
      el.querySelector(".btn").onclick = () => home("grammar"); app.append(el); celebrate(el.querySelector(".end"), xp, false); return;
    }
    const { v, t, p } = trials[i], form = f => f.split(" ").slice(1).join(" ");
    const right_ = form(v.t[t[0]].f[p]);
    const pool = [...new Set([...v.t[t[0]].f.map(form), ...T.map(([k]) => form(v.t[k].f[p]))].filter(x => x !== right_))];
    const opts = shuffle([right_, ...pick(pool, 3)]);
    app.replaceChildren();
    const el = $(`<div class="lesson"><div class="l-top"><button class="x" aria-label="Kapat">${I.x}</button><div class="l-prog"><i style="width:${i * 10}%"></i></div></div>
      <div class="l-body"><div class="tag">Fiili çekimle</div><h2 class="prompt"><span class="lvl">${esc(t[1])}</span></h2>
      <div class="vq"><span class="vp">${lab[p]}</span><span class="vgap">?</span><span class="vinf">${esc(v.v)} · ${esc(v.tr)}</span></div><div class="grid2"></div></div>
      <div class="sheet"><button class="btn" disabled>Kontrol et</button></div></div>`);
    el.querySelector(".x").onclick = () => home("grammar");
    const g = el.querySelector(".grid2"), btn = el.querySelector(".sheet .btn"), sheet = el.querySelector(".sheet"); let sel = null;
    opts.forEach(o => { const b = $(`<button class="opt">${esc(o)}</button>`); b.onclick = () => { g.querySelectorAll(".opt").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); sel = o; btn.disabled = false; el.querySelector(".vgap").textContent = o; }; g.append(b); });
    btn.onclick = () => {
      const ok = sel === right_; if (ok) right++;
      g.querySelectorAll(".opt").forEach((b, k) => { b.disabled = true; if (opts[k] === right_) b.classList.add("ok"); else if (opts[k] === sel) b.classList.add("no"); });
      ok ? sfx.ok() : sfx.no(); sheet.className = "sheet " + (ok ? "ok" : "no");
      sheet.innerHTML = `<div class="fb pop"><div class="ic">${ok ? `<span style="color:var(--good)">${I.check}</span>` : eagle(44, "sad")}</div><div><b>${ok ? "Doğru!" : "Doğrusu:"}</b><span>${esc(lab[p] + " " + right_)}</span></div></div>`;
      const nb = $(`<button class="btn ${ok ? "good" : "bad"}">Devam</button>`); sheet.append(nb); nb.focus(); nb.onclick = () => { i++; step(); };
    };
    app.append(el);
  };
  loadPack("fiiller"); step();
}

/* ---------- Role-play: answer the other person, then repeat your line aloud ---------- */
function openRole(r) {
  preload(r.turns.flatMap(t => [t.a, ...t.o.map(o => o.a)])); loadPack("roller", true);
  if (curAudio) curAudio.pause();
  app.replaceChildren();
  const el = $(`<div class="lesson role"><div class="l-top"><button class="x" aria-label="Kapat">${I.x}</button><div class="l-prog"><i style="width:0%"></i></div>
      <button class="chip trbtn" type="button" aria-pressed="false">Çeviri</button></div>
    <div class="l-body"><div class="goalbox">${icons(r.cover)}<div><b>Görev</b><span>${esc(r.goal)}</span></div></div><div class="chat"></div></div>
    <div class="sheet rsheet"></div></div>`);
  const chat = el.querySelector(".chat"), sheet = el.querySelector(".rsheet"), prog = el.querySelector(".l-prog i");
  let ti = 0, first = 0, showTr = false;
  el.querySelector(".x").onclick = () => { if (curAudio) curAudio.pause(); home("stories"); };
  el.querySelector(".trbtn").onclick = e => { showTr = !showTr; e.currentTarget.setAttribute("aria-pressed", String(showTr)); el.classList.toggle("show-tr", showTr); };
  const bubble = (who, l, me) => {
    const b = $(`<div class="cb ${me ? "me" : "npc"} pop">${me ? "" : `<div class="av">${icons(r.av)}</div>`}<div class="cbt"><div class="who">${esc(me ? "Sen" : r.npc)}</div><div class="sq">${kara(l)}</div><div class="tr">${esc(l.tr)}</div></div>
      <button class="speaker sm" aria-label="Dinle">${I.speaker}</button></div>`);
    b.querySelector(".speaker").onclick = () => say(l, false, me ? r.f : !r.f);
    chat.append(b); b.scrollIntoView({ block: "end", behavior: "smooth" }); return b;
  };
  const after = (pr, fn) => { let done = false; const go = () => { if (!done) { done = true; setTimeout(fn, 350); } }; Promise.resolve(pr).then(au => { if (!au) return go(); au.addEventListener("ended", go, { once: true }); au.addEventListener("error", go, { once: true }); }); setTimeout(go, 9000); };
  const turn = () => {
    prog.style.width = Math.round(ti / r.turns.length * 100) + "%";
    if (ti >= r.turns.length) return end();
    const t = r.turns[ti]; let missed = false;
    bubble(r.npc, t, false);
    sheet.className = "sheet rsheet"; sheet.innerHTML = `<div class="rk">Cevabını seç</div>`;
    const list = $(`<div class="list"></div>`); sheet.append(list);
    after(say(t, false, !r.f), () => {});
    shuffle(t.o).forEach(o => {
      const b = $(`<button class="opt row ropt"><span class="rsq">${esc(o.sq)}</span><span class="rtr">${esc(o.tr)}</span></button>`);
      b.onclick = () => {
        if (o.ok) {
          sfx.ok(); if (!missed) first++;
          list.querySelectorAll(".opt").forEach(x => x.disabled = true); b.classList.add("ok");
          sheet.querySelector(".rfb")?.remove();
          bubble("Sen", o, true);
          ti++; after(say(o, false, r.f), turn);
        } else {
          sfx.no(); missed = true; b.classList.add("no"); b.disabled = true;
          sheet.querySelector(".rfb")?.remove();
          list.before($(`<div class="rfb pop">${eagle(34, "sad")}<span>${esc(o.fb || "Bu cevap uymuyor, tekrar dene.")}</span></div>`));
        }
      };
      list.append(b);
    });
    const fr = $(`<button class="chip free" type="button">${icon("✍️")} Kendi cevabımı yazayım</button>`);
    fr.onclick = () => {
      const good = t.o.find(o => o.ok);
      const box = $(`<div class="hookbox"><textarea rows="2" lang="sq" autocapitalize="off" placeholder="Arnavutça cevabını yaz…"></textarea><button class="chip" type="button">Gönder</button></div>`);
      fr.replaceWith(box); box.querySelector("textarea").focus();
      box.querySelector("button").onclick = () => {
        const v = box.querySelector("textarea").value.trim(); if (!v) return;
        bubble("Sen", { sq: v, tr: "" }, true).querySelector(".speaker").remove();
        const same = norm(v) === norm(good.sq);
        box.replaceWith($(`<div class="rfb pop ${same ? "ok" : ""}"><span>${same ? "Birebir doğru!" : "Örnek cevap:"} <b>${esc(good.sq)}</b> <small>${esc(good.tr)}</small></span></div>`));
        const row = $(`<div class="grid2"><button class="btn ghost">Benimki de uygun</button><button class="btn ghost">Seçeneklere dön</button></div>`);
        if (same) row.children[1].remove();
        row.children[0].onclick = () => { sfx.ok(); if (!missed) first++; row.remove(); bubble("Sen", good, true); ti++; after(say(good, false, r.f), turn); };
        if (row.children[1]) row.children[1].onclick = () => { missed = true; row.remove(); };
        sheet.append(row);
      };
    };
    sheet.append(fr);
  };
  const end = () => {
    const stars = first === r.turns.length ? 3 : first >= r.turns.length - 2 ? 2 : 1;
    const firstTime = !P.roles[r.id]; P.roles[r.id] = Math.max(P.roles[r.id] || 0, stars);
    const xp = firstTime ? 10 : 5; P.xp += xp; P.dayXp += xp; logDay(xp); bumpStreak(); save(); sfx.win();
    sheet.className = "sheet ok";
    sheet.innerHTML = `<div class="fb pop"><div class="ic">${"⭐".repeat(stars)}</div><div><b>Konuşma tamamlandı! +${xp} XP</b><span>${first} / ${r.turns.length} cevabı ilk denemede bildin. Konuşmayı baştan dinleyip kendi cümlelerini sesli tekrar et.</span></div></div>`;
    const row = $(`<div class="grid2"><button class="btn ghost">${I.play}Baştan dinle</button><button class="btn good">Devam</button></div>`);
    row.children[0].onclick = () => { const all = r.turns.flatMap(t => [[t, !r.f], [t.o.find(o => o.ok), r.f]]); let k = 0; const nx = () => { if (k < all.length) { const [l, alt] = all[k++]; after(say(l, false, alt), nx); } }; nx(); };
    row.children[1].onclick = () => { if (curAudio) curAudio.pause(); home("stories"); };
    sheet.append(row); celebrate(el.querySelector(".l-body"), xp, false);
  };
  app.append(el); turn();
}

/* ---------- Record yourself and compare with the model voice (waveforms side by side) ---------- */
function recorder(w) {
  const box = $(`<div class="rec"><button class="btn ghost rec-b" type="button">${icon("🎙️")} Kendini kaydet ve karşılaştır</button><div class="rec-out" hidden>
    <canvas class="wave" width="600" height="120" aria-label="Ses dalgaları: üstte örnek, altta sen"></canvas>
    <div class="row"><button class="chip rp1" type="button">${I.play}Örnek</button><button class="chip rp2" type="button">${I.play}Sen</button><span class="sub">Mavi örnek ses, kırmızı senin sesin. Uzunluk ve vurgu benzer mi?</span></div></div></div>`);
  const btn = box.querySelector(".rec-b"), out = box.querySelector(".rec-out");
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) { btn.disabled = true; btn.textContent = "Bu cihazda ses kaydı desteklenmiyor"; return box; }
  let rec = null, url = null, timer = null;
  const peaks = async (buf, n = 120) => { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const a = await AC.decodeAudioData(buf), d = a.getChannelData(0), step = Math.max(1, Math.floor(d.length / n)), o = []; for (let i = 0; i < n; i++) { let m = 0; for (let j = i * step; j < (i + 1) * step && j < d.length; j++) m = Math.max(m, Math.abs(d[j])); o.push(m); } const mx = Math.max(.01, ...o); return { p: o.map(x => x / mx), dur: a.duration }; };
  const draw = (A, B) => {
    const c = box.querySelector(".wave"), x = c.getContext("2d"), W = c.width, H = c.height, md = Math.max(A.dur, B.dur);
    x.clearRect(0, 0, W, H);
    [[A, "#2e7bd6", H * .27], [B, "#c8162f", H * .75]].forEach(([S, col, cy]) => { x.fillStyle = col; const bw = W * (S.dur / md) / S.p.length; S.p.forEach((v, i) => { const h = Math.max(2, v * H * .22); x.fillRect(i * bw, cy - h, Math.max(1, bw - 1), h * 2); }); });
  };
  btn.onclick = async () => {
    if (rec && rec.state === "recording") { rec.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const chunks = []; rec = new MediaRecorder(stream);
      rec.ondataavailable = e => chunks.push(e.data);
      rec.onstop = async () => {
        clearTimeout(timer); stream.getTracks().forEach(t => t.stop());
        btn.innerHTML = `${icon("🎙️")} Tekrar kaydet`; btn.classList.remove("live");
        const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" }); if (url) URL.revokeObjectURL(url); url = URL.createObjectURL(blob);
        out.hidden = false;
        box.querySelector(".rp1").onclick = () => say(w); box.querySelector(".rp2").onclick = () => { if (curAudio) curAudio.pause(); curAudio = new Audio(url); curAudio.play().catch(() => {}); };
        try { await loadPack(w.a.split("#")[0]); const src = clipSrc(w.a); const [A, B] = await Promise.all([fetch(src).then(r => r.arrayBuffer()).then(b => peaks(b)), blob.arrayBuffer().then(b => peaks(b))]); draw(A, B); } catch {}
        box.querySelector(".rp2").click();
      };
      rec.start(); btn.innerHTML = `<span class="dot"></span> Kaydediliyor… bitirmek için dokun`; btn.classList.add("live");
      timer = setTimeout(() => rec.state === "recording" && rec.stop(), 7000);
    } catch { btn.textContent = "Mikrofon izni verilmedi"; }
  };
  return box;
}

    const sp = r.querySelector(".speaker"); if (cw && cw.a) sp.onclick = () => say(cw); else sp.style.visibility = "hidden";
    r.querySelector(".nb-del").onclick = () => { delete P.nb[k]; save(); r.remove(); };
  });

    e.preventDefault(); const f = e.target, k = f.sq.value.trim().toLowerCase(); if (!k) return;

  };

}

/* ---------- Placement / jump test: pass and the earlier units are marked as learned ---------- */
function jumpTest(target) {
  const pool = UNITS.slice(0, target).flatMap(u => u.w).filter(w => w.a);
  const ws = pick(pool, 12);
  const steps = ws.map(w => ({ k: pickOne(["listen", "toSq", "toTr", recallKind(w)]), w }));
  preload(ws.map(w => w.a));
  LS = { L: null, review: true, jump: target, steps, i: 0, hearts: 3, total: steps.length, right: 0, tries: 0, t0: Date.now(), practice: true, redo: [] };
  renderStep();
}
function placementTest() {
  // a short ladder: 4 questions each from the start, middle and end of A1, then A2
  const a1 = UNITS.filter(u => u.season !== 3).length;
  const cut = [Math.round(a1 / 3), Math.round(a1 * 2 / 3), a1].find(c => !LESSONS.slice(0, UNITS.slice(0, c).reduce((n, u) => n + u.lessons.length, 0)).every(isDone)) || a1;
  jumpTest(cut);
}

/* ---------- Daily reminder (Android app only, via Capacitor Local Notifications) ---------- */
const LN = () => { try { return window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications; } catch { return null; } };
async function scheduleReminder() {
  const ln = LN(); if (!ln) return;
  try {
    await ln.cancel({ notifications: [{ id: 1 }] });
    if (!P.rem || !P.rem.on) return;

/* lesson step: find the new words in the unit's scene */
function sceneFind(st, ui) {
  const sc = sceneEl(st.u), queue = shuffle(st.ws); let k = 0, miss = 0;
  ui.body.append($(`<div class="tag">${icon("🗺️")} Sahnede bul</div>`));
  const pr = $(`<div class="scene-q"><button class="speaker sm" aria-label="Dinle">${I.speaker}</button><b></b><span class="sub"></span></div>`);
  ui.body.append(pr, sc.el);
  const ask = () => { const w = queue[k]; pr.querySelector("b").textContent = w.sq; pr.querySelector(".sub").textContent = `${k + 1} / ${queue.length} · nerede?`; pr.querySelector(".speaker").onclick = () => say(w); say(w); };
  sc.btns.forEach(b => b.onclick = () => {
    if (k >= queue.length) return;
    const w = queue[k];
    if (b.w === w) { sfx.tap(); b.classList.add("found"); b.querySelector(".lb").hidden = false; k++; if (k < queue.length) setTimeout(ask, 400); else { ui.btn.disabled = false; ui.btn.textContent = "Devam"; ui.btn.className = "btn good"; ui.btn.onclick = () => { LS.tries++; if (!miss) LS.right++; queue.forEach(x => srsUpdate(x, true, 2)); P.scene[st.u.id] = 1; save(); sfx.ok(); LS.i++; renderStep(); }; } }
    else { miss++; sfx.no(); b.classList.add("nope"); b.querySelector(".lb").hidden = false; setTimeout(() => { b.classList.remove("nope"); if (!b.classList.contains("found")) b.querySelector(".lb").hidden = true; }, 1100); }
  });
  ask();
}

/* ---------- Production with a letter bank (no blank page, but you build the word yourself) ---------- */
function letterBank(target, done, opts = {}) {
  const word = target.replace(/[?!.,…]/g, "").trim(), letters = [...word.toLowerCase()].filter(c => c !== " ");
  const extra = pick([..."aeiouëbcçdfghjklmnpqrstvz"].filter(c => !letters.includes(c)), letters.length > 8 ? 2 : 4);
  const tiles = shuffle([...letters, ...extra]);
  const el = $(`<div class="lbank"><div class="lline" aria-label="Cevabın">${letters.map(() => `<span class="slot"></span>`).join("")}</div><div class="ltiles"></div>
    <div class="row"><button class="chip undo" type="button">⌫ Sil</button><button class="chip hintb" type="button">${I.bulb} İpucu</button><button class="btn sm okb" type="button" disabled>Kontrol et</button></div></div>`);
  const slots = [...el.querySelectorAll(".slot")], box = el.querySelector(".ltiles"), chosen = [];
  let hinted = false, over = false;
  const refresh = () => { slots.forEach((s2, i) => { s2.textContent = chosen[i] ? chosen[i].c : ""; s2.classList.toggle("on", !!chosen[i]); }); el.querySelector(".okb").disabled = chosen.length !== letters.length; };
  const btns = tiles.map(c => { const b = $(`<button class="ltile" type="button">${esc(c)}</button>`); b.onclick = () => { if (over || b.disabled || chosen.length >= letters.length) return; sfx.tap(); b.disabled = true; chosen.push({ c, b }); refresh(); }; box.append(b); return { c, b }; });
  el.querySelector(".undo").onclick = () => { const x = chosen.pop(); if (x) { x.b.disabled = false; refresh(); } };
  el.querySelector(".hintb").onclick = () => {
    hinted = true; opts.onHint && opts.onHint();
    while (chosen.length && chosen.some((x, i) => x.c !== letters[i])) { const x = chosen.pop(); x.b.disabled = false; }
    const need = letters[chosen.length], t = btns.find(x => x.c === need && !x.b.disabled); if (t) t.b.click();
  };
  const onKey = e => { if (!document.body.contains(el)) return document.removeEventListener("keydown", onKey); if (e.key === "Backspace") { el.querySelector(".undo").click(); return; } if (e.key === "Enter") { el.querySelector(".okb").click(); return; } const t = btns.find(x => x.c === e.key.toLowerCase() && !x.b.disabled); if (t) t.b.click(); };
  document.addEventListener("keydown", onKey);
  el.querySelector(".okb").onclick = () => {
    if (over || chosen.length !== letters.length) return; over = true;
    const ok = chosen.map(x => x.c).join("") === letters.join("");
    slots.forEach((s2, i) => s2.classList.add(chosen[i].c === letters[i] ? "good" : "bad"));
    el.querySelectorAll("button").forEach(b => b.disabled = true);
    done(ok, hinted);
  };
  return el;
}

function openFilm(s) {
  preload(s.lines.map(l => l.a)); loadPack("s-" + s.id, true);
  if (curAudio) curAudio.pause();
  const speakers = [...new Set(s.lines.filter(l => l.who).map(l => l.who))].slice(0, 3);
  app.replaceChildren();
  const el = $(`<div class="film"><div class="f-top"><button class="x" aria-label="Kapat">${I.x}</button><div class="f-t">${icon("🎬")} ${esc(s.t)}</div><button class="chip trbtn" type="button" aria-pressed="true">Çeviri</button></div>
    <div class="stage"><div class="cam"><svg class="bg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice">${SCENES[STORY_SCENE[s.id] || s.id] || SCENES.familja}</svg>
      ${speakers.map((who, i) => `<div class="actor a${speakers.length === 1 ? 1 : speakers.length === 2 ? i * 2 : i}" data-who="${esc(who)}">${personSVG(PEOPLE[who] || { g: "m", hair: "#2a2122", top: "#5a6a7a" })}<span>${esc(who)}</span></div>`).join("")}</div>
      <div class="title-card"><div>${icons(s.cover)}</div><b>${esc(s.t)}</b><small>${s.lines.length} sahne · ${s.lv || "A1"}</small></div></div>
    <div class="subs"><div class="who"></div><div class="sq"></div><div class="tr"></div></div>
    <div class="f-ctl"><button class="chip prev" type="button">⏮</button><button class="speaker play" aria-label="Oynat / durdur">${I.play}</button><button class="chip next" type="button">⏭</button><span class="pos sub"></span></div></div>`);
  app.append(el);
  const cam = el.querySelector(".cam"), subs = el.querySelector(".subs"), actors = [...el.querySelectorAll(".actor")];
  let i = -1, playing = true, run = 0, showTr = true;
  const show = k => {
    const l = s.lines[k]; i = k;
    el.querySelector(".title-card").classList.add("gone");
    actors.forEach(a => { a.classList.add("in"); a.classList.toggle("talk", a.dataset.who === l.who); });
    const a = actors.find(x => x.dataset.who === l.who);
    if (a) { const dx = 50 - (a.offsetLeft + a.offsetWidth / 2) / cam.offsetWidth * 100; cam.style.transform = `scale(1.22) translateX(${Math.max(-8, Math.min(8, dx))}%)`; }
    else cam.style.transform = `scale(${1.06 + (k % 3) * .04}) translateX(${(k % 2 ? -1 : 1) * 2}%)`;
    subs.querySelector(".who").textContent = l.who || "Anlatıcı"; subs.querySelector(".sq").innerHTML = kara(l); subs.querySelector(".tr").textContent = l.tr; subs.querySelector(".tr").hidden = !showTr;
    el.querySelector(".pos").textContent = `${k + 1} / ${s.lines.length}`;
  };
  const go = k => {
    const my = ++run; if (k >= s.lines.length) { actors.forEach(a => a.classList.remove("talk")); cam.style.transform = "scale(1)"; el.querySelector(".title-card").classList.remove("gone"); el.querySelector(".title-card small").textContent = "Son · tekrar izlemek için ▶"; playing = false; el.querySelector(".play").innerHTML = I.play; i = -1; return; }
    show(k); if (!playing) return;
    Promise.resolve(say(s.lines[k], false, s.lines[k].f)).then(au => { const nx = () => { if (my === run && playing) setTimeout(() => my === run && go(k + 1), 600); }; if (!au) return nx(); au.addEventListener("ended", nx, { once: true }); au.addEventListener("error", nx, { once: true }); });
  };
  el.querySelector(".x").onclick = () => { run++; if (curAudio) curAudio.pause(); openStory(s, true); };
  el.querySelector(".play").onclick = () => { playing = !playing; if (playing) go(i < 0 ? 0 : i); else { run++; if (curAudio) curAudio.pause(); } };
  el.querySelector(".prev").onclick = () => go(Math.max(0, i - 1));
  el.querySelector(".next").onclick = () => go(Math.min(s.lines.length - 1, i + 1));
  el.querySelector(".trbtn").onclick = e => { showTr = !showTr; e.currentTarget.setAttribute("aria-pressed", String(showTr)); subs.querySelector(".tr").hidden = !showTr; };
  setTimeout(() => go(0), 1400);
}

/* ---------- Module exam: all four skills on the module's material ---------- */
function moduleExam(mi) {
  const ws = UNITS.filter(u => u.mod === mi).flatMap(u => u.w).filter(w => w.a);
  const pool = shuffle(ws), steps = [];
  pool.slice(0, 3).forEach(w => steps.push({ k: "listen", w }));
  pool.slice(3, 6).forEach(w => steps.push({ k: "toTr", w }));
  pool.slice(6, 10).forEach(w => steps.push({ k: multi(w) && w.sq.split(" ").length <= 7 ? "build" : spellable(w) ? "spell" : "toSq", w }));
  const f = pool.slice(10).find(fillable); if (f) steps.push({ k: "fill", w: f });
  pool.slice(11, 13).forEach(w => steps.push({ k: "speak", w }));
  preload(steps.map(x => x.w.a));
  LS = { L: null, review: true, exam: mi, steps, i: 0, hearts: 5, total: steps.length, right: 0, tries: 0, t0: Date.now(), practice: true, redo: [], log: [] };
  renderStep();
}

const XW_OK = w => { const a = w.sq.toLowerCase().replace(/[?!.,…]/g, "").trim(); return /^[a-zëç]{3,10}$/.test(a) ? a : null; };
function makeCross(words) {
  const ws = words.map(w => ({ w, a: XW_OK(w) })).filter(x => x.a).sort((x, y) => y.a.length - x.a.length);
  const cells = new Map(), K = (r, c) => r + "," + c, placed = [];
  const fits = (a, r, c, d) => {
    let cross = 0;
    if (cells.has(d ? K(r - 1, c) : K(r, c - 1)) || cells.has(d ? K(r + a.length, c) : K(r, c + a.length))) return -1;
    for (let i = 0; i < a.length; i++) {
      const rr = r + (d ? i : 0), cc = c + (d ? 0 : i), ex = cells.get(K(rr, cc));
      if (ex) { if (ex.ch !== a[i] || ex.dirs.has(d)) return -1; cross++; }
      else if (cells.has(d ? K(rr, cc - 1) : K(rr - 1, cc)) || cells.has(d ? K(rr, cc + 1) : K(rr + 1, cc))) return -1;
    }
    return cross;
  };
  const put = (x, r, c, d) => { for (let i = 0; i < x.a.length; i++) { const k = d ? K(r + i, c) : K(r, c + i); const e = cells.get(k) || { ch: x.a[i], dirs: new Set() }; e.dirs.add(d); cells.set(k, e); } placed.push({ ...x, r, c, d }); };
  ws.forEach((x, n) => {
    if (!placed.length) return put(x, 0, 0, 0);
    let best = null;
    cells.forEach((e, k) => { const [r, c] = k.split(",").map(Number); for (let i = 0; i < x.a.length; i++) if (x.a[i] === e.ch) for (const d of [0, 1]) {
      const r0 = d ? r - i : r, c0 = d ? c : c - i, f = fits(x.a, r0, c0, d);
      if (f > 0) { const all = [...cells.keys()].map(q => q.split(",").map(Number)).concat([[r0, c0], [d ? r0 + x.a.length : r0, d ? c0 : c0 + x.a.length]]);
        const area = (Math.max(...all.map(a => a[0])) - Math.min(...all.map(a => a[0]))) * (Math.max(...all.map(a => a[1])) - Math.min(...all.map(a => a[1])));
        const sc = f * 100 - area; if (!best || sc > best.sc) best = { r: r0, c: c0, d, sc }; } } });
    if (best && placed.length < 8) put(x, best.r, best.c, best.d);
  });
  const rs = [...cells.keys()].map(k => +k.split(",")[0]), cs = [...cells.keys()].map(k => +k.split(",")[1]);
  const r0 = Math.min(...rs), c0 = Math.min(...cs);
  placed.forEach(p => { p.r -= r0; p.c -= c0; });
  placed.sort((a, b) => a.r - b.r || a.c - b.c);
  let n = 0; const num = {};
  placed.forEach(p => { const k = K(p.r, p.c); if (!num[k]) num[k] = ++n; p.n = num[k]; });
  return { placed, rows: Math.max(...rs) - r0 + 1, cols: Math.max(...cs) - c0 + 1, num };
}
function crossword(host, u, onDone) {

  let cur = X.placed[0], pos = 0, hints = 0;

  const bar = $(`<div class="row xbar"><button class="chip xh" type="button">${I.bulb} Harf ver</button><button class="chip xs" type="button">${I.speaker} Dinle</button><button class="btn sm xk" type="button">Kontrol et</button></div>`);

function memoryCards(host, ws, onDone) {

    <div class="pchar">${personSVG(PEOPLE[ex.who] || { g: "m", hair: "#2a2122", top: "#5a6a7a" }, ex.mood)}</div>
    <div class="pbub">${bubble}</div></div>`;
}

/* ---------- Teach step: rule → three examples (panel + colour blocks that fly from Turkish to Albanian) → try ---------- */
function blocksRow(ex) {
  const el = $(`<div class="blk"><div class="brow tr"><span class="bl">TR</span>${ex.trb.map(([t, c]) => `<span class="mc c${c}" data-c="${c}">${esc(t)}</span>`).join("")}</div>
    <div class="barrow">↓</div><div class="brow sq"><span class="bl">SQ</span>${ex.sqb.map(([t, c]) => `<span class="mc c${c}" data-c="${c}">${esc(t)}</span>`).join("")}</div></div>`);
  el.play = () => {
    const trs = [...el.querySelectorAll(".brow.tr .mc")], sqs = [...el.querySelectorAll(".brow.sq .mc")];
    sqs.forEach((b, i) => {
      const src = trs.find(t => t.dataset.c === b.dataset.c), to = b.getBoundingClientRect();
      if (!src) return b.animate([{ opacity: 0, transform: "scale(.5)" }, { opacity: 1, transform: "none" }], { duration: 500, delay: 300 + i * 250, fill: "backwards" });
      const fr = src.getBoundingClientRect();
      b.animate([{ transform: `translate(${fr.left - to.left}px,${fr.top - to.top}px)`, opacity: .6 }, { transform: "none", opacity: 1 }], { duration: 800, delay: 300 + i * 250, easing: "cubic-bezier(.2,.8,.2,1)", fill: "backwards" });
      src.animate([{ boxShadow: "0 0 0 0 rgba(0,0,0,0)" }, { boxShadow: "0 0 0 4px var(--gold)" }, { boxShadow: "0 0 0 0 rgba(0,0,0,0)" }], { duration: 700, delay: 300 + i * 250 });
    });
  };
  return el;
}
function teachView(host, p, onEnd) {
  let i = 0;
  const pre = PATS.length && p.ex.map(e => e.a);
  preload(pre || []);
  const box = $(`<div class="teach"><div class="tag new">${icon("💡")} Önce anla</div><h2 class="prompt">${esc(p.t)}</h2><div class="trule">${p.rule}</div><div class="tex"></div>
    <div class="row tnav"><button class="chip replay" type="button">${I.play}Tekrar oynat</button><button class="btn sm next" type="button">Sonraki örnek</button></div></div>`);
  const tex = box.querySelector(".tex");
  const show = () => {
    const ex = p.ex[i]; tex.innerHTML = "";
    tex.append($(comicPanel(ex)), $(`<div class="ttr">${esc(ex.tr)}</div>`));
    const br = blocksRow(ex); tex.append(br);
    box.querySelector(".tag").innerHTML = `${icon("💡")} Önce anla · örnek ${i + 1} / ${p.ex.length}`;
    const go = () => { br.play(); setTimeout(() => say(ex, false, manSpeaks(ex.who)), 250); };
    box.querySelector(".replay").onclick = go; setTimeout(go, 200);
    box.querySelector(".next").textContent = i < p.ex.length - 1 ? "Sonraki örnek" : (p.builder ? "Sayı kurucuya geç" : "Şimdi sen dene");
  };
  box.querySelector(".next").onclick = () => {
    if (i < p.ex.length - 1) { i++; show(); return; }
    if (p.builder && !box.querySelector(".nb")) { tex.innerHTML = ""; numberBuilder(tex); box.querySelector(".replay").style.display = "none"; box.querySelector(".next").textContent = "Şimdi sen dene"; return; }
    onEnd();
  };
  host.append(box); show();
}
function teach(st, ui) {
  ui.btn.hidden = true;
  teachView(ui.body, st.p, () => { P.tipsSeen[st.p.unit] = 1; save(); LS.i++; renderStep(); });
}
function openPattern(p) {
  if (!p) return; if (curAudio) curAudio.pause(); app.replaceChildren();
  const el = $(`<div class="lesson"><div class="l-top"><button class="x" aria-label="Kapat">${I.x}</button><div style="flex:1;font-family:var(--f-display);font-weight:700">${icon("💡")} Kural</div></div><div class="l-body"></div><div class="sheet"></div></div>`);
  el.querySelector(".x").onclick = () => home(TAB);
  app.append(el);
  teachView(el.querySelector(".l-body"), p, () => {
    const steps = shuffle(p.drills).map(d => ({ k: "gap", d, p }));
    LS = { L: null, review: true, steps, i: 0, hearts: 5, total: steps.length, right: 0, tries: 0, t0: Date.now(), practice: true, redo: [] };
    renderStep();
  });
}
/* Gap step: the grammar point in a full sentence, options only for that point, explanation after */
function gap(st, ui) {
  const d = st.d, w = { sq: d.full, tr: d.tr, a: d.a, k: d.k, u: st.p.unit };
  st.w = w;
  ui.body.append($(`<div class="tag">${icon("✏️")} Boşluğu doldur · ${esc(st.p.t)}</div>`));
  const q = $(`<div class="gq">${esc(d.s).replace("___", `<span class="gap" id="gap">&nbsp;&nbsp;&nbsp;&nbsp;</span>`)}</div>`);
  ui.body.append(q, $(`<div class="sub" style="text-align:center">${esc(d.tr)}</div>`));
  const order = shuffle(d.o.map((o, k) => ({ o, k }))), g = $(`<div class="grid3 gopts"></div>`); let sel = null;
  order.forEach(({ o, k }) => { const b = $(`<button class="opt">${esc(o)}</button>`); b.onclick = () => { g.querySelectorAll(".opt").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); sel = k; q.querySelector("#gap").textContent = o; ui.btn.disabled = false; }; g.append(b); });
  ui.body.append(g);
  ui.btn.onclick = () => {
    const ok = sel === 0; skill("g", ok);
    g.querySelectorAll(".opt").forEach((b, j) => { b.disabled = true; if (order[j].k === 0) b.classList.add("ok"); else if (order[j].k === sel) b.classList.add("no"); });
    resolve(ui, ok, d.full, st);
    ui.sheet.querySelector(".fb").insertAdjacentHTML("afterend", `<div class="why">${icon("💡")} ${d.why}</div>`);
  };
}

/* ---------- Number builder: see the system, then build numbers yourself ---------- */
function numParts(n) {
  const U = ["", "një", "dy", "tre", "katër", "pesë", "gjashtë", "shtatë", "tetë", "nëntë"], T = { 1: "dhjetë", 2: "njëzet", 3: "tridhjetë", 4: "dyzet", 5: "pesëdhjetë", 6: "gjashtëdhjetë", 7: "shtatëdhjetë", 8: "tetëdhjetë", 9: "nëntëdhjetë" };
  const TN = { 2: "yirmi", 3: "üç-on (otuz)", 4: "iki-yirmi (kırk)", 5: "beş-on (elli)", 6: "altı-on (altmış)", 7: "yedi-on (yetmiş)", 8: "sekiz-on (seksen)", 9: "dokuz-on (doksan)" };
  if (n === 100) return [["njëqind", 0, "yüz"]];
  if (n === 0) return [["zero", 0, "sıfır"]];
  if (n < 10) return [[U[n], 2, "birler"]];
  if (n === 10) return [["dhjetë", 0, "on"]];
  if (n < 20) return [[U[n - 10], 2, "birler"], ["mbëdhjetë", 1, "“on üstü”"]];
  const t = Math.floor(n / 10), u = n % 10;
  return u ? [[T[t], 0, TN[t]], ["e", 1, "ve"], [U[u], 2, "birler"]] : [[T[t], 0, TN[t]]];
}
function numberBuilder(host) {
  const box = $(`<div class="nb"><div class="tag">${icon("🔢")} Sayı kurucu</div><div class="nbig">21</div><div class="nparts"></div>
    <input type="range" min="0" max="100" value="21" aria-label="Sayı seç"><div class="row" style="justify-content:center;gap:8px"><button class="chip m1" type="button">−1</button><button class="chip p1" type="button">+1</button><button class="chip pl" type="button">${I.play}Dinle</button></div>
    <div class="nquiz"><b>Sen kur:</b> <span class="nq"></span><div class="nqo"></div></div></div>`);
  const rng = box.querySelector("input"), big = box.querySelector(".nbig"), parts = box.querySelector(".nparts");
  preload(NUMS.map(x => x.a));
  const show = (n, speak) => { big.textContent = n; parts.innerHTML = numParts(n).map(([t, c, h]) => `<span class="np"><span class="mc c${c}">${esc(t)}</span><small>${esc(h)}</small></span>`).join(""); if (speak) { const x = NUMS[n]; if (x) say(x); } };
  rng.oninput = () => show(+rng.value, false); rng.onchange = () => show(+rng.value, true);
  box.querySelector(".m1").onclick = () => { rng.value = Math.max(0, +rng.value - 1); show(+rng.value, true); };
  box.querySelector(".p1").onclick = () => { rng.value = Math.min(100, +rng.value + 1); show(+rng.value, true); };
  box.querySelector(".pl").onclick = () => show(+rng.value, true);
  const quiz = () => {
    const n = 21 + Math.floor(Math.random() * 79); if (n % 10 === 0) return quiz();
    box.querySelector(".nq").textContent = n;
    const right = NUMS[n].sq, alts = new Set([right]);
    const t = Math.floor(n / 10), u = n % 10;
    [NUMS[(t === 4 ? 2 : 4) * 10 + u], NUMS[t * 10 + ((u % 9) + 1)], NUMS[10 + u]].forEach(x => x && alts.add(x.sq));
    const o = box.querySelector(".nqo"); o.innerHTML = "";
    shuffle([...alts].slice(0, 3)).forEach(a => { const b = $(`<button class="chip" type="button">${esc(a)}</button>`); b.onclick = () => { const ok = a === right; ok ? sfx.ok() : sfx.no(); skill("g", ok); b.classList.add(ok ? "okc" : "noc"); rng.value = n; show(n, true); if (ok) setTimeout(quiz, 1500); }; o.append(b); });
  };
  host.append(box); show(21, false); quiz();
}

/* ---------- Grammar tab: every pattern lesson, openable any time ---------- */
function patternSection(view) {
  if (!PATS.length) return;
  const box = $(`<details class="gsec" open><summary>${icon("💡")} Kurallar: önce anla, sonra dene · ${PATS.length} konu</summary><div class="gbody"><p class="sub" style="margin:0">Her kural resimli örneklerle anlatılır: aynı renk aynı anlam. Türkçedeki ekin Arnavutçada nereye gittiğini izle, sonra boşluk doldurarak dene.</p><div class="pats"></div></div></details>`);
  const list = box.querySelector(".pats");
  PATS.forEach(p => { const u = UNITS.find(x => x.id === p.unit); const b = $(`<button class="story-card" type="button"><span class="ic cover">${u ? icons(u.ic) : icon("💡")}</span><span><span class="t">${esc(p.t)}</span><br><span class="s">${u ? esc(u.t) : ""}</span></span></button>`); b.onclick = () => openPattern(p); list.append(b); });
  view.append(box);
}

/* ---------- Finish ---------- */
function finish(passed) {
  app.replaceChildren();
  const secs = Math.round((Date.now() - LS.t0) / 1000);
  const acc = LS.tries ? Math.round(LS.right / LS.tries * 100) : 100;
  let xp = 0;
  if (passed) {
    xp = LS.review ? 5 : LS.practice ? 5 : 10;
    if (LS.tries && LS.right === LS.tries) xp += 5;
    var goalHit = P.dayXp < GOAL && P.dayXp + xp >= GOAL;
    P.xp += xp; P.dayXp += xp; logDay(xp);
    if (LS.L) P.done[LS.L.id] = 1;
    if (LS.exam !== undefined) { const lg = LS.log || [], by = {}; lg.forEach(x => { const k = SKILL_OF[x.k] || "o"; by[k] = by[k] || [0, 0]; by[k][1]++; if (x.ok) by[k][0]++; }); P.exams[LS.exam] = { pct: Math.round(lg.filter(x => x.ok).length / Math.max(1, lg.length) * 100), d: today(), sk: by }; save(); }
    if (LS.check) { const lg = LS.log || [], scn = lg.filter(x => SCENEMAP[x.u]); P.checks.push({ d: today(), n: lg.length, ok: lg.filter(x => x.ok).length, sn: scn.length, sok: scn.filter(x => x.ok).length }); save(); }
    if (LS.jump !== undefined) UNITS.slice(0, LS.jump).forEach(u => u.lessons.forEach(L => P.done[L.id] = 1));
    bumpStreak(); save(); sfx.win();
  }
  if (passed && LS.prep) { P.storyPrep[LS.prep.id] = 1; save(); }
  const where = LS.exam !== undefined && P.exams[LS.exam] ? `Modül sınavı: %${P.exams[LS.exam].pct} · ${Object.entries(P.exams[LS.exam].sk).map(([k, [a, n]]) => SKILL_NAME[k] + " " + a + "/" + n).join(" · ")}${P.exams[LS.exam].pct >= 70 ? " · geçtin!" : " · %70 hedef: zayıf beceriyi tekrar et"}` : LS.prep ? "Hikâye hazırlığı tamam: şimdi okumaya hazırsın" : LS.check ? `Hafıza kontrolü: ${LS.right} / ${LS.tries} hatırlandı` : LS.jump !== undefined ? (passed ? `${LS.jump} ünite açıldı. Ünite ${LS.jump + 1}'den devam!` : "") : LS.review ? "Tekrar oturumu" : esc(LS.L.unit.t) + " · ders " + (LS.L.li + 1);
  const el = $(`<div class="lesson"><div class="end">
    <div class="pop">${eagle(140, passed ? "happy" : "sad")}</div>
    <h2 class="${passed ? "" : "fail"}">${passed ? (LS.jump !== undefined ? "Test geçildi!" : LS.tries && LS.right === LS.tries ? "Kusursuz!" : LS.review ? "Tekrar tamamlandı!" : "Ders tamamlandı!") : "Canların bitti"}</h2>
    <p style="margin:0;color:var(--muted)">${passed ? where + (P.streak > 1 ? " · " + P.streak + " günlük seri" : "") : "Sorun değil, tekrar dene. Yanlışlar en iyi öğretmendir."}</p>
    <div class="end-stats">
      <div class="es x"><div class="h">XP</div><div class="v">+${xp}</div></div>
      <div class="es a"><div class="h">Doğruluk</div><div class="v">${acc}%</div></div>
      <div class="es t"><div class="h">Süre</div><div class="v">${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}</div></div>
    </div></div>
    <div class="sheet"><button class="btn ${passed ? "good" : ""}">${passed ? "Devam" : "Tekrar dene"}</button></div></div>`);
  if (!passed && LS.jump !== undefined) el.querySelector(".end p").textContent = "Bu sefer olmadı. Dersleri sırayla yapmak da hızlı ilerletir!";
  el.querySelector(".sheet .btn").onclick = () => LS.prep ? openStory(LS.prep, true) : LS.jump !== undefined ? home("learn") : passed ? home(LS.review ? "review" : "learn") : (LS.review ? startReview(LS.steps.filter(x => x.w).map(x => x.w)) : startLesson(LS.L));
  app.append(el);
  if (passed) celebrate(el.querySelector(".end"), xp, goalHit);
  el.querySelector(".sheet .btn").focus();
}
</script>
