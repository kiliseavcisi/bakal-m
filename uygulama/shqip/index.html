<meta charset="utf-8">
<title>Shqiponja</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: single centered column. Home = unit banners + zig-zag lesson path. Lesson = full-height screen: top bar, exercise, bottom check sheet. */
:root {
  --bg: #fbf8f6;
  --surface: #ffffff;
  --surface-2: #f2ece9;
  --line: #e4dcd8;
  --fg: #2a2122;
  --muted: #7d7172;
  --accent: #c8162f;          /* Albanian red */
  --accent-deep: #8f0f22;
  --accent-soft: #fbe3e6;
  --ink: #241c1d;             /* eagle black */
  --good: #3a9a46; --good-deep: #2a7434; --good-soft: #e3f4e4;
  --bad: #d43b3b; --bad-deep: #a32626; --bad-soft: #fde6e4;
  --gold: #f2a516; --gold-soft: #fff1d2;
  --blue: #2e7bd6;
  --f-display: "Fredoka", "Segoe UI Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  --f-body: "Lexend", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171314; --surface: #221c1d; --surface-2: #2d2627; --line: #3b3233; --fg: #f3eeed; --muted: #a99d9e;
    --accent: #f04a5f; --accent-deep: #a8182c; --accent-soft: #3c1b20; --ink: #f3eeed;
    --good: #5cc46a; --good-deep: #2f8a3b; --good-soft: #1b3320; --bad: #f06b6b; --bad-deep: #b23434; --bad-soft: #3f1d1d;
    --gold: #f5b73a; --gold-soft: #3a2d12; --blue: #5fa2ef; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171314; --surface: #221c1d; --surface-2: #2d2627; --line: #3b3233; --fg: #f3eeed; --muted: #a99d9e;
  --accent: #f04a5f; --accent-deep: #a8182c; --accent-soft: #3c1b20; --ink: #f3eeed;
  --good: #5cc46a; --good-deep: #2f8a3b; --good-soft: #1b3320; --bad: #f06b6b; --bad-deep: #b23434; --bad-soft: #3f1d1d;
  --gold: #f5b73a; --gold-soft: #3a2d12; --blue: #5fa2ef; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 17px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.app { max-width: 620px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
svg { display: block; }

/* chunky game buttons */
.btn {
  font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; letter-spacing: .04em; text-transform: uppercase;
  border-radius: 16px; padding: 14px 20px; background: var(--accent); color: #fff;
  box-shadow: 0 4px 0 var(--accent-deep); transition: transform .08s, box-shadow .08s; width: 100%;
}
.btn:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-deep); }
.btn[disabled] { background: var(--surface-2); color: var(--muted); box-shadow: 0 4px 0 var(--line); cursor: default; }
.btn.good { background: var(--good); box-shadow: 0 4px 0 var(--good-deep); }
.btn.bad { background: var(--bad); box-shadow: 0 4px 0 var(--bad-deep); }
.btn.ghost { background: var(--surface); color: var(--fg); box-shadow: 0 4px 0 var(--line); border: 2px solid var(--line); }

/* ---- Home ---- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px; border-bottom: 2px solid var(--line);
}
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; color: var(--accent); }
.stats { display: flex; gap: 14px; align-items: center; font-family: var(--f-display); font-weight: 600; font-variant-numeric: tabular-nums; }
.stats span { display: flex; align-items: center; gap: 4px; }
.s-fire { color: var(--gold); } .s-xp { color: var(--blue); } .s-heart { color: var(--bad); }

.goal { display: flex; gap: 14px; align-items: center; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 12px 16px; margin-top: 16px; }
.goal .txt { flex: 1; min-width: 0; }
.goal b { font-family: var(--f-display); font-size: 1.1rem; }
.goal .sub { color: var(--muted); font-size: .9rem; }
.gbar { height: 12px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.gbar i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .4s; }

.unit { margin-top: 22px; }
.unit-head {
  background: var(--accent); color: #fff; border-radius: 18px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  box-shadow: 0 4px 0 var(--accent-deep);
}
.unit-head.locked { background: var(--surface-2); color: var(--muted); box-shadow: 0 4px 0 var(--line); }
.unit-head .k { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; opacity: .85; font-weight: 600; }
.unit-head h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; margin: 0; }
.unit-head .peek { font-size: .88rem; opacity: .9; text-align: right; }
.path { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-block: 22px 6px; }
.node-wrap { position: relative; display: flex; flex-direction: column; align-items: center; }
.node {
  width: 74px; height: 70px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff;
  box-shadow: 0 6px 0 var(--accent-deep); transition: transform .08s, box-shadow .08s; font-family: var(--f-display); font-weight: 700; font-size: 1.3rem;
}
.node:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-deep); }
.node.done { background: var(--gold); box-shadow: 0 6px 0 #b77a06; }
.node.locked { background: var(--surface-2); color: var(--muted); box-shadow: 0 6px 0 var(--line); cursor: default; }
.node.current { outline: 6px solid var(--accent-soft); }
.bubble {
  position: absolute; bottom: calc(100% + 10px); background: var(--surface); border: 2px solid var(--line); color: var(--accent);
  font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 6px 12px; border-radius: 12px; white-space: nowrap;
  animation: bob 1.4s ease-in-out infinite;
}
.bubble::after { content: ""; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); border: 8px solid transparent; border-top-color: var(--line); }
@keyframes bob { 50% { transform: translateY(-4px); } }
.mascot-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 4px; }
.foot { color: var(--muted); font-size: .85rem; text-align: center; padding-block: 28px; max-width: 52ch; margin: 0 auto; }

/* ---- Lesson ---- */
.lesson { min-height: 100%; display: flex; flex-direction: column; }
.l-top { display: flex; align-items: center; gap: 12px; padding-block: 14px; }
.l-top .x { width: 40px; height: 40px; display: grid; place-items: center; color: var(--muted); border-radius: 10px; }
.l-prog { flex: 1; height: 16px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.l-prog i { display: block; height: 100%; background: var(--good); border-radius: 99px; transition: width .35s; box-shadow: inset 0 -4px 0 rgba(0,0,0,.08); }
.hearts { display: flex; align-items: center; gap: 4px; color: var(--bad); font-family: var(--f-display); font-weight: 700; }
.l-body { flex: 1; display: flex; flex-direction: column; gap: 18px; padding-block: 8px 24px; }
.prompt { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; margin: 0; text-wrap: balance; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.tag.new { color: var(--blue); }
.speak-row { display: flex; align-items: center; gap: 14px; }
.speaker {
  width: 72px; height: 72px; border-radius: 20px; background: var(--blue); color: #fff; display: grid; place-items: center; flex: none;
  box-shadow: 0 5px 0 #1f5aa0;
}
.speaker.sm { width: 52px; height: 52px; border-radius: 14px; }
.speaker:active { transform: translateY(3px); box-shadow: 0 2px 0 #1f5aa0; }
.slow { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); color: var(--blue); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: .8rem; }
.bubble-say { position: relative; border: 2px solid var(--line); border-radius: 16px; padding: 12px 16px; font-size: 1.2rem; font-weight: 600; background: var(--surface); min-width: 0; overflow-wrap: anywhere; }

.intro { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 22px 16px; border: 2px solid var(--line); border-radius: 22px; background: var(--surface); }
.intro .sq { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.8rem, 7vw, 2.6rem); color: var(--accent); overflow-wrap: anywhere; }
.intro .tr { font-size: 1.2rem; color: var(--muted); }

.pic { display: grid; place-items: center; line-height: 1; }
.pic.emoji { font-size: 64px; }
.pic.big.emoji { font-size: 96px; }
.pic .sw { width: 64px; height: 64px; border-radius: 16px; border: 2px solid var(--line); }
.pic.big .sw { width: 110px; height: 110px; border-radius: 24px; }
.pic .num { font-family: var(--f-display); font-weight: 700; font-size: 46px; color: var(--blue); font-variant-numeric: tabular-nums; }
.pic.big .num { font-size: 80px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opt {
  border: 2px solid var(--line); border-radius: 18px; background: var(--surface); padding: 14px; box-shadow: 0 4px 0 var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; min-width: 0;
  font-weight: 600; overflow-wrap: anywhere; transition: transform .08s;
}
.opt.row { flex-direction: row; justify-content: flex-start; text-align: left; padding: 14px 16px; }
.opt:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.opt.sel { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, var(--surface)); box-shadow: 0 4px 0 var(--blue); }
.opt.ok { border-color: var(--good); background: var(--good-soft); box-shadow: 0 4px 0 var(--good); color: var(--good-deep); }
.opt.no { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 4px 0 var(--bad); color: var(--bad-deep); }
.opt.gone { opacity: .35; pointer-events: none; }
.opt .num-k { width: 26px; height: 26px; border: 2px solid var(--line); border-radius: 8px; display: grid; place-items: center; font-size: .8rem; color: var(--muted); flex: none; }
.list { display: flex; flex-direction: column; gap: 10px; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

.answer-line { min-height: 64px; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; padding-bottom: 10px; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tile { border: 2px solid var(--line); border-radius: 12px; padding: 8px 14px; background: var(--surface); box-shadow: 0 3px 0 var(--line); font-weight: 600; }
.tile.used { color: transparent; background: var(--surface-2); box-shadow: none; pointer-events: none; }
textarea {
  width: 100%; min-height: 110px; resize: vertical; border: 2px solid var(--line); border-radius: 16px; background: var(--surface-2);
  font: inherit; font-size: 1.15rem; padding: 14px; color: var(--fg);
}
.keys { display: flex; gap: 8px; flex-wrap: wrap; }
.keys button { border: 2px solid var(--line); border-radius: 10px; padding: 6px 14px; font-weight: 700; background: var(--surface); }

.sheet {
  position: sticky; bottom: 0; margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  border-top: 2px solid var(--line); background: var(--bg); display: flex; flex-direction: column; gap: 12px;
}
.sheet.ok { background: var(--good-soft); border-color: transparent; }
.sheet.no { background: var(--bad-soft); border-color: transparent; }
.sheet .fb { display: flex; gap: 12px; align-items: center; }
.sheet .fb .ic { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); flex: none; }
.sheet.ok .fb { color: var(--good-deep); } .sheet.no .fb { color: var(--bad-deep); }
.sheet .fb b { font-family: var(--f-display); font-size: 1.35rem; display: block; }
.sheet .fb span { font-size: 1rem; overflow-wrap: anywhere; }
:root[data-theme="dark"] .sheet.ok .fb, :root[data-theme="dark"] .sheet.no .fb { color: var(--fg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sheet.ok .fb, :root:not([data-theme="light"]) .sheet.no .fb { color: var(--fg); } }

.end { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding-block: 24px; }
.end h2 { font-family: var(--f-display); font-size: 2rem; margin: 0; color: var(--gold); }
.end h2.fail { color: var(--bad); }
.end-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.es { border: 2px solid; border-radius: 16px; overflow: hidden; }
.es .h { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #fff; padding: 4px; }
.es .v { font-family: var(--f-display); font-size: 1.5rem; font-weight: 700; padding: 10px 4px; background: var(--surface); font-variant-numeric: tabular-nums; }
.es.x { border-color: var(--gold); } .es.x .h { background: var(--gold); } .es.x .v { color: var(--gold); }
.es.a { border-color: var(--good); } .es.a .h { background: var(--good); } .es.a .v { color: var(--good); }
.es.t { border-color: var(--blue); } .es.t .h { background: var(--blue); } .es.t .v { color: var(--blue); }
.pop { animation: pop .35s ease-out; }
@keyframes pop { 0% { transform: scale(.9); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }
.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.loading { padding: 40px 0; text-align: center; color: var(--muted); }

/* ---- Bottom nav + tabs ---- */
.view { flex: 1; padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
nav.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--bg); border-top: 2px solid var(--line);
  display: flex; justify-content: center; padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
nav.bottom .in { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; width: 100%; max-width: 620px; }
nav.bottom button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; color: var(--muted); font-size: .78rem; font-weight: 600; position: relative; }
nav.bottom button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
nav.bottom .badge { position: absolute; top: 2px; right: calc(50% - 22px); background: var(--bad); color: #fff; border-radius: 99px; font-size: .68rem; padding: 0 6px; font-variant-numeric: tabular-nums; }
.unit-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-weight: 600; font-size: .9rem; color: var(--fg); text-decoration: none; }
.chip.yt { color: var(--accent); }
.tipbox { margin-top: 10px; background: var(--gold-soft); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: .95rem; }
.tipbox b { color: var(--accent); }
.section-h { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; margin: 18px 0 4px; }
.lead { color: var(--muted); margin: 0 0 12px; max-width: 60ch; }
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.big-num { font-family: var(--f-display); font-weight: 700; font-size: 3rem; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
.boxes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.boxes div { background: var(--surface-2); border-radius: 10px; padding: 6px 2px; text-align: center; font-size: .72rem; color: var(--muted); }
.boxes b { display: block; font-family: var(--f-display); font-size: 1.15rem; color: var(--fg); font-variant-numeric: tabular-nums; }
.story-list { display: flex; flex-direction: column; gap: 10px; }
.story-card { display: flex; gap: 14px; align-items: center; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 14px; box-shadow: 0 4px 0 var(--line); }
.story-card .ic { width: 52px; height: 52px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.story-card .t { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; }
.story-card .s { color: var(--muted); font-size: .88rem; }
.story-card.done .ic { background: var(--gold-soft); color: var(--gold); }
.lines { display: flex; flex-direction: column; gap: 10px; }
.line { display: flex; gap: 10px; align-items: flex-start; }
.line .who { font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.line .txt { flex: 1; min-width: 0; border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; background: var(--surface); text-align: left; }
.line .txt .sq { font-weight: 600; font-size: 1.08rem; }
.line .txt .tr { color: var(--tr, var(--muted)); font-size: .92rem; color: var(--muted); }
.line.playing .txt { border-color: var(--blue); }
.line .speaker { width: 44px; height: 44px; border-radius: 12px; box-shadow: 0 3px 0 #1f5aa0; }
.line .speaker svg { width: 22px; height: 22px; }
.alpha { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.letter { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px; box-shadow: 0 3px 0 var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.letter.d { border-color: var(--accent); box-shadow: 0 3px 0 var(--accent-deep); }
.letter .L { font-family: var(--f-display); font-weight: 700; font-size: 1.7rem; color: var(--accent); line-height: 1.1; }
.letter .say { font-weight: 600; }
.letter .ex { color: var(--muted); font-size: .86rem; overflow-wrap: anywhere; }
.shadow-steps { display: flex; flex-direction: column; gap: 8px; color: var(--muted); font-size: .95rem; }
.tipbox[hidden] { display: none; }
.hw { border-bottom: 2px dashed color-mix(in srgb, var(--muted) 60%, transparent); cursor: pointer; }
.hw:hover { border-bottom-color: var(--blue); }
.hint-pop { position: absolute; z-index: 50; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.15);
  display: flex; flex-direction: column; min-width: 120px; max-width: 260px; overflow: hidden; font-size: .98rem; }
.hint-pop b { padding: 8px 14px; background: var(--surface-2); font-family: var(--f-display); }
.hint-pop span { padding: 8px 14px; border-top: 2px solid var(--line); }
.gap { display: inline-block; min-width: 4em; border-bottom: 3px solid var(--blue); color: var(--blue); text-align: center; }
.sub-tr { color: var(--muted); font-size: .9rem; font-weight: 400; margin-top: 6px; }
.vgroup { font-family: var(--f-display); font-size: 1.1rem; margin: 18px 0 8px; color: var(--accent); }
.vrow { display: flex; gap: 10px; align-items: stretch; margin-bottom: 8px; }
.vchk { display: grid; place-items: center; width: 44px; flex: none; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; }
.vchk input { width: 22px; height: 22px; accent-color: var(--good); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.vmain { flex: 1; min-width: 0; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; text-decoration: none; color: var(--fg);
  border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; background: var(--surface); }

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ı/g, "i").replace(/[?!.,…'’"]/g, "").replace(/\s+/g, " ").trim();
function pic(p, big = false) {
  if (!p) return "";
  const c = "pic" + (big ? " big" : "");
  if (p.startsWith("#")) return `<span class="${c}"><span class="sw" style="background:${p}"></span></span>`;
  if (p.startsWith("n:")) return `<span class="${c}"><span class="num">${p.slice(2)}</span></span>`;
  if (p.startsWith("cal:")) return `<span class="${c}"><span class="cal"><i></i>${esc(p.slice(4))}</span></span>`;
  if (p.startsWith("sym:")) return `<span class="${c}"><span class="sym">${esc(p.slice(4))}</span></span>`;
  return `<span class="${c} emoji" role="img">${p}</span>`;
}

function picMini(p) {
  if (!p) return "";
  if (p.startsWith("#")) return `<i class="mini-sw" style="background:${p}"></i>`;
  if (p.startsWith("n:")) return `<b class="mini-t">${esc(p.slice(2))}</b>`;
  if (p.startsWith("cal:") || p.startsWith("sym:")) return `<b class="mini-t">${esc(p.slice(4, 7))}</b>`;
  return `<span>${p}</span>`;
}
const unitOf = w => UNITS.find(u => u.id === w.u) || { hue: 350, ic: "📘" };

function startReview(words) {
  const ws = shuffle(words).slice(0, 12);
  const steps = ws.map(w => ({ k: pickOne(typesFor(w, true)), w }));
  if (ws.length >= 4) steps.splice(Math.min(4, steps.length), 0, { k: "match", ws: ws.slice(0, 5) });
  preload(ws.map(w => w.a));
  LS = { L: null, review: true, steps, i: 0, hearts: 5, total: steps.length, right: 0, tries: 0, t0: Date.now(), practice: true, redo: [] };
  renderStep();
}

/* ---------- Lesson engine ---------- */
let LS = null;
/* Lesson flow (research-based): introduce in context → recognise by ear → recall/build → produce → spaced review */
const multi = w => w.sq.replace(/[?!.,…]/g, "").trim().includes(" ");
function recallKind(w) { return multi(w) && w.sq.split(" ").length <= 7 ? "build" : "toSq"; }
function typesFor(w, review = false) {
  // used by review sessions: retrieval-heavy, production-leaning
  const t = ["listen", recallKind(w), recallKind(w), "dictate"];
  if (fillable(w)) t.push("fill");
  if (review) t.push("speak");
  return t;
}
function startLesson(L) {
  const practice = isDone(L);
  const words = L.words;
  const prev = LESSONS.slice(0, LESSONS.indexOf(L)).flatMap(x => x.words);
  const dueOld = dueWords().filter(w => prev.includes(w));
  const review = (dueOld.length ? shuffle(dueOld) : shuffle(prev)).slice(0, Math.min(3, prev.length));
  const steps = [];
  if (L.li === 0 && !P.tipsSeen[L.unit.id]) steps.push({ k: "tip", u: L.unit });
  // 1. introduce each new item, immediately followed by hearing it again (recognition)
  words.forEach(w => {
    if (!practice && !P.seen[w.sq]) steps.push({ k: "intro", w });
    steps.push({ k: "listen", w });
  });
  // 2. consolidate the set
  if (words.length >= 3) steps.push({ k: "match", ws: words.slice(0, 5) });
  // 3. recall: Turkish → Albanian (build the sentence or choose the word), fill the gap where possible
  shuffle(words).forEach(w => steps.push({ k: recallKind(w), w }));
  const gap = words.filter(fillable);
  if (gap.length) steps.push({ k: "fill", w: pickOne(gap) });
  // 4. produce: shadow one item aloud, write one from dictation
  const prod = shuffle(words);
  if (prod[0]) steps.push({ k: "speak", w: prod[0] });
  if (prod[1]) steps.push({ k: "dictate", w: prod[1] });
  // 5. spaced review of earlier items that are due
  review.forEach(w => steps.push({ k: pickOne(["listen", recallKind(w), "dictate"]), w }));
  preload([...words, ...review].map(w => w.a));
  LS = { L, steps, i: 0, hearts: 5, total: steps.length, right: 0, tries: 0, t0: Date.now(), practice, redo: [] };
  renderStep();
}
const pickOne = a => a[Math.random() * a.length | 0];
const unitHasPics = u => u.w.filter(w => w.p).length >= 4;
function distractors(w, field, n = 3) {
  const same = w.u ? UNITS.find(u => u.id === w.u).w : [];
  let pool = same.filter(x => x[field] !== w[field]);
  if (pool.length < n) pool = pool.concat(UNITS.flatMap(u => u.w).filter(x => x[field] !== w[field] && !pool.includes(x)));
  return pick(pool, n);
}

function lessonShell() {
  app.replaceChildren();
  const done = LS.i, total = LS.steps.length;
  const el = $(`<div class="lesson">
    <div class="l-top"><button class="x" aria-label="Dersten çık">${I.x}</button>
      <div class="l-prog" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><i style="width:${Math.round(done / total * 100)}%"></i></div>
      <div class="hearts" title="Can">${I.heart}${LS.hearts}</div></div>
    <div class="l-body"></div>
    <div class="sheet"><button class="btn" disabled>Kontrol et</button></div></div>`);
  el.querySelector(".x").onclick = () => { if (confirmQuit(el)) home(LS.review ? "review" : "learn"); };
  app.append(el);
  return { body: el.querySelector(".l-body"), sheet: el.querySelector(".sheet"), btn: el.querySelector(".sheet .btn"), root: el };
}
let quitArmed = false;
function confirmQuit(el) {
  if (LS.i === 0 || quitArmed) { quitArmed = false; return true; }
  quitArmed = true;
  const s = el.querySelector(".sheet");
  s.className = "sheet"; s.innerHTML = "";
  s.append($(`<div class="fb"><div class="ic">${eagle(44, "sad")}</div><div><b>Çıkmak istiyor musun?</b><span>Bu dersteki ilerlemen kaybolacak.</span></div></div>`));
  const row = $(`<div class="grid2"><button class="btn ghost">Devam et</button><button class="btn bad">Çık</button></div>`);
  row.children[0].onclick = () => { quitArmed = false; renderStep(); };
  row.children[1].onclick = () => { quitArmed = false; home(LS.review ? "review" : "learn"); };
  s.append(row);
  return false;
}

function renderStep() {
  if (LS.i >= LS.steps.length) {
    if (LS.redo.length) { LS.steps.push(...LS.redo); LS.redo = []; }
    else return finish(true);
  }
  const st = LS.steps[LS.i];
  const ui = lessonShell();
  ({ intro, listen, toSq, toTr, match, build, type, speak, tip, fill, dictate })[st.k](st, ui);
}

/* Bottom-sheet result + continue */
function resolve(ui, ok, correctText, st) {
  LS.tries++;

function build(st, ui, byEar = false) {

  const pool = [...new Set([...near, ...allWords().flatMap(strip)])].filter(t => !target.includes(t));
  const extra = [...pick(pool.filter(t => near.includes(t)), 2), ...pick(pool, 4)].filter((t, i, a) => a.indexOf(t) === i).slice(0, Math.max(3, 8 - target.length));
  const tiles = shuffle([...target, ...extra]);

  tiles.forEach((t, i) => {

      sfx.tap(); tb.classList.add("used");

      chosen.push({ t, ub, tb });
      ub.onclick = () => { ub.remove(); tb.classList.remove("used"); chosen.splice(chosen.findIndex(c => c.ub === ub), 1); ui.btn.disabled = !chosen.length; };

/* ---------- Tap-to-translate hints ---------- */
const TOK = /([\p{L}'’]+)/u;
function lookup(words, i, dict) {
  // try two-word phrases first ("e madhe", "u ul"), then single words
  if (i + 1 < words.length) { const two = (words[i] + " " + words[i + 1]).toLowerCase(); if (dict[two]) return [two, 2]; }
  const one = words[i].toLowerCase().replace(/’/g, "'");
  if (dict[one]) return [one, 1];
  if (dict === GLOSS) { // strip common definite endings: libri -> libër is not derivable, but shtëpia -> shtëpi is
    for (const suf of ["a", "ja", "i", "u", "in", "në", "t", "ve"]) if (one.endsWith(suf) && dict[one.slice(0, -suf.length)]) return [one.slice(0, -suf.length), 1];
  }
  return null;
}
function hint(text, lang) {
  const dict = lang === "sq" ? GLOSS : REV;
  const parts = text.split(TOK);       // odd indexes are words
  const words = [], idx = [];
  parts.forEach((p, k) => { if (k % 2) { words.push(p); idx.push(k); } });
  let out = parts.map(esc);
  for (let i = 0; i < words.length; i++) {
    const hit = lookup(words, i, dict);
    if (!hit) continue;
    const [key, n] = hit, g = dict[key];
    if (n === 2) { out[idx[i]] = `<span class="hw" data-g="${esc(g)}">${esc(words[i])}${parts[idx[i] + 1] ? esc(parts[idx[i] + 1]) : " "}${esc(words[i + 1])}</span>`; out[idx[i] + 1] = ""; out[idx[i + 1]] = ""; i++; }
    else out[idx[i]] = `<span class="hw" data-g="${esc(g)}">${esc(words[i])}</span>`;
  }
  return out.join("");
}
let hintPop = null;
function closeHint() { if (hintPop) { hintPop.remove(); hintPop = null; } }

      <span class="pm">${pct === null ? "Henüz denenmedi" : pct + "% doğru · " + st.n + " deneme"}</span>
      <span class="bar"><i style="width:${pct || 0}%"></i></span></button>`);
    b.onclick = () => pairDrill([c]);
    g.append(b);
  });
  view.append(g);
  view.append($(`<h2 class="section-h">Alfabe: 36 harf</h2>`));
  view.append($(`<p class="lead">Arnavutça yazıldığı gibi okunur. Kırmızı çerçeveli harfler Türkçeden farklıdır. Bir harfe dokun, örnek kelimeyi dinle.</p>`));
  const ag = $(`<div class="alpha"></div>`);
  ALPHA.forEach(a => {
    const b = $(`<button class="letter ${a.d ? "d" : ""}"><span class="L">${esc(a.l.length > 1 ? a.l[0].toUpperCase() + a.l.slice(1) : a.l.toUpperCase())} ${esc(a.l)}</span>
      <span class="say">${esc(a.say)}</span>${a.hint ? `<span class="ex">${esc(a.hint)}</span>` : ""}<span class="ex"><b style="color:var(--fg)">${esc(a.ex)}</b> · ${esc(a.tr)}</span></button>`);
    b.onclick = () => say(a);
    ag.append(b);
  });
  view.append(ag);
  view.append($(`<div class="tipbox" style="margin-top:14px"><div><b>Akılda tut:</b> Türkçedeki <b>c</b> sesi Arnavutçada <b>xh</b>, <b>j</b> sesi <b>zh</b>, <b>y</b> sesi <b>j</b>, <b>ü</b> sesi <b>y</b> ile yazılır.</div></div>`));
}
function pairDrill(contrasts) {
  const trials = [];
  for (let i = 0; i < 12; i++) {
    const c = pickOne(contrasts), pr = pickOne(c.pairs), k = Math.random() < .5 ? 0 : 1;
    trials.push({ c, pr: Math.random() < .5 ? pr : [pr[1], pr[0]], target: null, k, alt: Math.random() < .5, rate: pickOne([.9, 1, 1.1]) });
  }
  trials.forEach(t => t.target = t.pr[t.k]);
  preload(contrasts.flatMap(c => c.pairs.flat().map(x => x.a)));
  let i = 0, right = 0;
  const play = t => { if (curAudio) curAudio.pause(); playClip(t.target.a, false, t.alt && P.vary !== false).then(au => { if (au) au.playbackRate = t.rate * RATE(); }); };
  const step = () => {
    if (i >= trials.length) {
      const xp = 5; P.xp += xp; P.dayXp += xp; logDay(xp); bumpStreak(); save(); sfx.win();
      app.replaceChildren();
      const el = $(`<div class="lesson"><div class="end"><div class="pop">${eagle(130)}</div><h2>Kulak antrenmanı bitti</h2>
        <p style="margin:0;color:var(--muted)">${right} / ${trials.length} doğru · +${xp} XP</p></div>
        <div class="sheet"><button class="btn good">Devam</button></div></div>`);
      el.querySelector(".btn").onclick = () => home("sounds"); app.append(el); return;
    }
    const t = trials[i];
    app.replaceChildren();
    const el = $(`<div class="lesson"><div class="l-top"><button class="x" aria-label="Kapat">${I.x}</button>
      <div class="l-prog"><i style="width:${Math.round(i / trials.length * 100)}%"></i></div><div class="hearts" style="color:var(--blue)">${esc(t.c.t)}</div></div>
      <div class="l-body"><div class="tag">Hangisini duydun?</div>
        <div class="speak-row" style="justify-content:center"><button class="speaker" aria-label="Tekrar dinle">${I.speaker}</button></div>
        <div class="grid2 pair-opts"></div>
        <div class="tipbox pair-tip" hidden><div>${t.c.tip}</div></div></div>
      <div class="sheet"><button class="btn" disabled>Kontrol et</button></div></div>`);
    el.querySelector(".x").onclick = () => home("sounds");
    el.querySelector(".speaker").onclick = () => play(t);
    const opts = el.querySelector(".pair-opts"), btn = el.querySelector(".sheet .btn"), sheet = el.querySelector(".sheet");
    let sel = null;
    t.pr.forEach((w, j) => {
      const b = $(`<button class="opt big-word"><span class="bw">${esc(w.sq)}</span><span class="lbl">${esc(w.tr)}</span></button>`);
      b.onclick = () => { opts.querySelectorAll(".opt").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); sel = j; btn.disabled = false; };
      opts.append(b);
    });
    btn.onclick = () => {
      const ok = sel === t.k;
      P.pairStats[t.c.id] = P.pairStats[t.c.id] || { n: 0, ok: 0 }; P.pairStats[t.c.id].n++; if (ok) { P.pairStats[t.c.id].ok++; right++; } save();
      opts.querySelectorAll(".opt").forEach((b, j) => { b.disabled = true; if (j === t.k) b.classList.add("ok"); else if (j === sel) b.classList.add("no"); });
      ok ? sfx.ok() : sfx.no();
      el.querySelector(".pair-tip").hidden = false;
      sheet.className = "sheet " + (ok ? "ok" : "no");
      sheet.innerHTML = `<div class="fb pop"><div class="ic">${ok ? `<span style="color:var(--good)">${I.check}</span>` : eagle(44, "sad")}</div><div><b>${ok ? "Doğru!" : "Duyulan: " + esc(t.target.sq)}</b><span>İkisini art arda dinle, farkı yakala.</span></div></div>`;
      const row = $(`<div class="grid2"><button class="btn ghost">${esc(t.pr[0].sq)} ▶</button><button class="btn ghost">${esc(t.pr[1].sq)} ▶</button></div>`);
      row.children[0].onclick = () => say(t.pr[0]); row.children[1].onclick = () => say(t.pr[1]);
      const nb = $(`<button class="btn ${ok ? "good" : "bad"}">Devam</button>`);
      sheet.append(row, nb); nb.focus();
      nb.onclick = () => { i++; step(); };
    };
    app.append(el);
    setTimeout(() => play(t), 250);
  };
  step();
}

/* ---------- Grammar tab: colour-coded reference (masculine blue, feminine red) ---------- */
const G = (w, g) => `<span class="g-${g}">${w}</span>`;
function grammarTab(view) {
  view.append($(`<h2 class="section-h">Gramer</h2>`));
  view.append($(`<p class="lead">Renkler cinsiyeti gösterir: <span class="g-m">eril</span> kelimeler mavi, <span class="g-f">dişil</span> kelimeler kırmızı. Renkle eşleştirmek cinsiyeti hatırlamayı kolaylaştırır. Arnavutça kelimelere dokununca dinleyebilirsin.</p>`));
  const sec = (title, body, note = "") => view.append($(`<details class="gsec"><summary>${title}</summary><div class="gbody">${body}${note ? `<div class="tipbox"><div>${note}</div></div>` : ""}</div></details>`));
  const tbl = (head, rows) => `<div class="gtable-wrap"><table class="gtable"><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  sec("1 · Cinsiyet ve belirli isim", tbl(["Belirsiz", "Belirli", "Türkçe"], [
    [G("një libër", "m"), G("libr<b>i</b>", "m"), "bir kitap / o kitap"], [G("një djalë", "m"), G("djal<b>i</b>", "m"), "bir oğlan / o oğlan"],
    [G("një mik", "m"), G("mik<b>u</b>", "m"), "bir dost / o dost"], [G("një vajzë", "f"), G("vajz<b>a</b>", "f"), "bir kız / o kız"],
    [G("një shtëpi", "f"), G("shtëpi<b>a</b>", "f"), "bir ev / o ev"], [G("një lule", "f"), G("lul<b>ja</b>", "f"), "bir çiçek / o çiçek"]]),
    "Türkçede olmayan bir şey: “o bildiğimiz” anlamı kelimenin sonuna eklenir. Eril: <b>-i / -u</b>, dişil: <b>-a / -ja</b>. Dişil kelimeler çoğunlukla <b>-ë / -e</b> ile biter.");
  sec("2 · jam (olmak) ve kam (sahip olmak)", tbl(["", "jam", "kam"], [
    ["unë (ben)", "jam", "kam"], ["ti (sen)", "je", "ke"], ["ai / ajo (o)", "është", "ka"], ["ne (biz)", "jemi", "kemi"], ["ju (siz)", "jeni", "keni"], ["ata / ato (onlar)", "janë", "kanë"]]),
    "Türkçedeki ekler (-im, -sin) Arnavutçada ayrı bir fiildir: <i>Unë jam mësues.</i> = Öğretmenim. Sahip olmak için <b>kam</b>: <i>Kam një motër.</i> = Bir kız kardeşim var.");
  sec("3 · Şimdiki zaman: -oj fiilleri", tbl(["", "punoj (çalışmak)", "lexoj (okumak)", "flas (konuşmak)"], [
    ["unë", "punoj", "lexoj", "flas"], ["ti", "punon", "lexon", "flet"], ["ai / ajo", "punon", "lexon", "flet"], ["ne", "punojmë", "lexojmë", "flasim"], ["ju", "punoni", "lexoni", "flisni"], ["ata", "punojnë", "lexojnë", "flasin"]]),
    "Şu anı vurgulamak için fiilin önüne <b>po</b>: <i>Po lexoj.</i> = Şu an okuyorum.");
  sec("4 · Geçmiş ve gelecek zaman", tbl(["Şimdi", "Geçmiş", "Gelecek", "Türkçe"], [
    ["punoj", "punova", "do të punoj", "çalışırım / çalıştım / çalışacağım"], ["lexoj", "lexova", "do të lexoj", "okurum / okudum / okuyacağım"],
    ["shkoj", "shkova", "do të shkoj", "giderim / gittim / gideceğim"], ["vij", "erdha", "do të vij", "gelirim / geldim / geleceğim"],
    ["ha", "hëngra", "do të ha", "yerim / yedim / yiyeceğim"], ["jam", "isha", "do të jem", "-im / idim / olacağım"]]),
    "Gelecek zaman her fiilde aynı kalıp: <b>do të</b> + fiil. Olumsuz: <b>nuk do të</b> shkoj = gitmeyeceğim.");
  sec("5 · Sıfatlar: i / e", tbl(["Eril", "Dişil", "Çoğul"], [
    [G("djalë <b>i</b> mirë", "m"), G("vajzë <b>e</b> mirë", "f"), "djem <b>të</b> mirë"], [G("libër <b>i</b> madh", "m"), G("shtëpi <b>e</b> madhe", "f"), "libra <b>të</b> mëdhenj"],
    [G("qen <b>i</b> vogël", "m"), G("mace <b>e</b> vogël", "f"), "qen <b>të</b> vegjël"]]),
    "Sıfat ismin <b>arkasından</b> gelir ve önüne isimle uyumlu bir küçük kelime alır: eril <b>i</b>, dişil <b>e</b>, çoğul <b>të</b>.");
  sec("6 · İyelik (benim, senin…)", tbl(["", "eril isimle", "dişil isimle"], [
    ["benim", G("libri im", "m"), G("shtëpia ime", "f")], ["senin", G("libri yt", "m"), G("shtëpia jote", "f")], ["onun (erkek)", G("libri i tij", "m"), G("shtëpia e tij", "f")],
    ["onun (kadın)", G("libri i saj", "m"), G("shtëpia e saj", "f")], ["bizim", G("libri ynë", "m"), G("shtëpia jonë", "f")], ["sizin", G("libri juaj", "m"), G("shtëpia juaj", "f")], ["onların", G("libri i tyre", "m"), G("shtëpia e tyre", "f")]]),
    "İyelik ismin arkasından gelir ve isim belirli halde olur: <i>familja ime</i> = ailem.");
  sec("7 · Olumsuzluk ve soru", tbl(["Kalıp", "Örnek", "Türkçe"], [
    ["nuk / s' + fiil", "Nuk flas shqip.", "Arnavutça konuşmuyorum."], ["mos + fiil (yasak)", "Mos harro!", "Unutma!"], ["A … ? (evet/hayır)", "A je mirë?", "İyi misin?"],
    ["Kush / Çfarë / Ku / Kur / Pse / Si / Sa", "Ku jeton?", "Nerede yaşıyorsun?"]]));
  sec("8 · Edatlar: yer ve yön", tbl(["Arnavutça", "Türkçe", "Örnek"], [
    ["në", "-de / -da", "në shtëpi = evde"], ["nga", "-den / -dan", "nga Turqia = Türkiye'den"], ["me", "ile", "me ty = seninle"], ["për", "için", "për mua = benim için"],
    ["mbi", "üstünde", "mbi tavolinë"], ["pranë", "yanında", "pranë shtëpisë"], ["para / prapa", "önünde / arkasında", "para shtëpisë"]]));
  view.querySelectorAll(".gtable td").forEach(td => {
    const t = td.textContent.trim();
    if (!/[ëçÇË]|^(unë|ti|ai|ne|ju|ata|jam|kam|nuk|mos|a |kush)/i.test(t) && !td.querySelector("span")) return;
    if (/[ğışü]/i.test(t)) return;   // Turkish cells
    td.classList.add("say-cell"); td.tabIndex = 0;
    td.onclick = () => playTTSFallback(t);
  });
}
/* grammar cells: play the clip if the phrase exists in the course, otherwise nothing */
function playTTSFallback(text) {
  const key = text.toLowerCase().replace(/[.!?]/g, "").trim();
  const w = allWords().find(x => x.sq.toLowerCase().replace(/[.!?]/g, "").trim() === key) || STORIES.flatMap(s => s.lines).find(x => x.sq.toLowerCase().replace(/[.!?]/g, "").trim() === key);
  if (w) say(w); else sfx.tap();
}

/* ---------- Review stats: memory strength + activity calendar ---------- */
function statsPanel() {
  const rs = Object.values(P.srs).filter(r => r.s);
  const buckets = [["< 1 gün", 0, 1], ["1–3 gün", 1, 3], ["3–7 gün", 3, 7], ["1–3 hafta", 7, 21], ["3 hafta +", 21, 1e9]];
  const counts = buckets.map(([, a, b]) => rs.filter(r => r.s >= a && r.s < b).length), max = Math.max(1, ...counts);
  const avgR = rs.length ? Math.round(rs.reduce((a, r) => a + recall(r), 0) / rs.length * 100) : 0;
  const days = []; for (let i = 34; i >= 0; i--) { const d = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10); days.push([d, (P.log || {})[d] || 0]); }
  return $(`<div class="panel" style="margin-top:14px">
    <div style="display:flex;gap:16px;align-items:center"><div class="big-num" style="color:var(--good)">${avgR}%</div><div><b>ortalama hatırlama olasılığı</b><div class="sub">FSRS hafıza modeline göre, şu an</div></div></div>
    <div><b style="font-size:.9rem">Hafıza gücü (kelime kaç gün akılda kalır)</b>
      <div class="strength">${buckets.map(([l], i) => `<div class="sb"><span class="sv">${counts[i]}</span><span class="sbar" style="height:${Math.round(counts[i] / max * 70) + 4}px;background:hsl(${120 * i / 4} 60% 45%)"></span><span class="sl">${l}</span></div>`).join("")}</div></div>
    <div><b style="font-size:.9rem">Son 5 hafta</b><div class="cal35">${days.map(([d, v]) => `<i title="${d}: ${v} XP" style="opacity:${v ? Math.min(1, .3 + v / 40) : 1};background:${v ? "var(--good)" : "var(--surface-2)"}"></i>`).join("")}</div></div>
  </div>`);
}

/* ---------- Finish ---------- */
function finish(passed) {
  app.replaceChildren();
  const secs = Math.round((Date.now() - LS.t0) / 1000);
  const acc = LS.tries ? Math.round(LS.right / LS.tries * 100) : 100;
  let xp = 0;
  if (passed) {
    xp = LS.review ? 5 : LS.practice ? 5 : 10;
    if (LS.hearts === 5) xp += 5;
    P.xp += xp; P.dayXp += xp; logDay(xp);
    if (LS.L) P.done[LS.L.id] = 1;
    bumpStreak(); save(); sfx.win();
  }
  const where = LS.review ? "Tekrar oturumu" : esc(LS.L.unit.t) + " · ders " + (LS.L.li + 1);
  const el = $(`<div class="lesson"><div class="end">
    <div class="pop">${eagle(140, passed ? "happy" : "sad")}</div>
    <h2 class="${passed ? "" : "fail"}">${passed ? (LS.hearts === 5 ? "Kusursuz!" : LS.review ? "Tekrar tamamlandı!" : "Ders tamamlandı!") : "Canların bitti"}</h2>
    <p style="margin:0;color:var(--muted)">${passed ? where + (P.streak > 1 ? " · " + P.streak + " günlük seri" : "") : "Sorun değil, tekrar dene. Yanlışlar en iyi öğretmendir."}</p>
    <div class="end-stats">
      <div class="es x"><div class="h">XP</div><div class="v">+${xp}</div></div>
      <div class="es a"><div class="h">Doğruluk</div><div class="v">${acc}%</div></div>
      <div class="es t"><div class="h">Süre</div><div class="v">${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}</div></div>
    </div></div>
    <div class="sheet"><button class="btn ${passed ? "good" : ""}">${passed ? "Devam" : "Tekrar dene"}</button></div></div>`);
  el.querySelector(".sheet .btn").onclick = () => passed ? home(LS.review ? "review" : "learn") : (LS.review ? startReview(LS.steps.filter(x => x.w).map(x => x.w)) : startLesson(LS.L));
  app.append(el);
  el.querySelector(".sheet .btn").focus();
}
