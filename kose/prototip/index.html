<meta charset="utf-8">
<title>Kose Vitrin Prototipi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600;700&family=Onest:wght@400;500;600&display=swap&subset=latin-ext,cyrillic">
<style>
/* Layout: duyuru bandı → yapışkan header (logo, kategoriler, arama, dil, sepet) → görünüm (ana sayfa | liste | ürün | sepet | sipariş | doğrulama | onay) → footer.
   Tek tema: mağaza bilinçli olarak açık zeminde tasarlandı (yön C · Qiell). */
:root{
  --brand:#244aa5; --brand-hover:#1c3c8a; --ink:#0e1a33; --muted:#5a6680; --line:#e3e8f2;
  --ice:#eaf1fd; --ice-2:#f4f7fc; --white:#ffffff; --gold:#c9a24a; --ok:#1f7a4d; --err:#b42318;
  --glow:linear-gradient(135deg,#244aa5 0%,#5aa0ea 100%);
  --f-display:"Geologica","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --r-lg:22px; --max:1200px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--white);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--white)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.015em;text-wrap:balance;line-height:1.12}
p{margin:0}
.in{max-width:var(--max);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Duyuru + prototip notu */
.strip{background:var(--ink);color:#fff;font-size:.8rem}
.strip .in{display:flex;justify-content:space-between;gap:12px;padding-block:7px;flex-wrap:wrap}
.strip b{font-weight:600}
.proto{opacity:.65}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:20px;padding-block:14px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);flex:none}
.logo svg{color:var(--brand)}
.logo span{font-family:var(--f-display);font-weight:700;font-size:1.55rem;letter-spacing:-.04em;line-height:1}
.search{flex:1;min-width:0;max-width:520px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--ice-2);border-radius:99px;padding:10px 16px 10px 40px;outline:none;transition:border-color .15s,background .15s}
.search input:focus{border-color:var(--brand);background:#fff}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.hact{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;padding:3px}
.lang button{border:0;background:none;padding:5px 9px;border-radius:99px;font-size:.78rem;font-weight:600;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.cartbtn{display:flex;align-items:center;gap:8px;text-decoration:none;border-radius:99px;padding:9px 14px;background:var(--brand);color:#fff;font-weight:600;font-size:.9rem;transition:background .15s}
.cartbtn:hover{background:var(--brand-hover)}
.cartbtn .n{background:#fff;color:var(--brand);border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.75rem;font-variant-numeric:tabular-nums;padding:0 6px}
.catnav{display:flex;gap:4px;padding-bottom:10px;overflow-x:auto;scrollbar-width:none}
.catnav::-webkit-scrollbar{display:none}
.catnav a{flex:none;text-decoration:none;font-size:.9rem;color:var(--muted);padding:6px 12px;border-radius:99px;transition:background .15s,color .15s}
.catnav a:hover{background:var(--ice-2);color:var(--ink)}
.catnav a[aria-current="page"]{background:var(--ice);color:var(--brand);font-weight:600}

/* Butonlar */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;text-decoration:none;border-radius:99px;padding:13px 22px;font-weight:600;font-size:.95rem;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--brand);color:#fff}
.btn.p:hover{background:var(--brand-hover)}
.btn.g{background:var(--ice-2);color:var(--ink);border:1px solid var(--line)}
.btn.g:hover{background:var(--ice)}
.btn.w{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}

main{min-height:60vh}
.view{padding-block:28px 64px;display:grid;gap:56px}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);background:linear-gradient(160deg,var(--ice) 0%,#fff 72%);border:1px solid var(--line)}
.hero::after{content:"";position:absolute;right:-140px;top:-160px;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#7db6f0 0%,#244aa5 52%,transparent 71%);opacity:.85;pointer-events:none}
.hgrid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:center;padding:56px 48px}
.hero h1{font-size:clamp(2rem,4.4vw,3.4rem);font-weight:700;max-width:16ch}
.hero p{color:var(--muted);font-size:1.08rem;max-width:44ch;margin-top:16px}
.hbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.hstack{position:relative;height:380px}
.hstack .t{position:absolute;background:#fff;border-radius:18px;box-shadow:0 30px 60px -30px rgba(14,26,51,.45);padding:14px;display:grid;gap:8px;width:170px;font-size:.82rem;text-decoration:none;color:var(--ink);transition:transform .25s}
.hstack .t:hover{transform:translateY(-4px)}
.hstack .t .im{aspect-ratio:1/1;border-radius:12px;display:grid;place-items:center;max-width:100%}
.hstack .t b{font-variant-numeric:tabular-nums}
.hstack .t:nth-child(1){left:2%;top:56px}
.hstack .t:nth-child(2){left:38%;top:0;width:190px}
.hstack .t:nth-child(3){left:60%;top:118px}
@media (prefers-reduced-motion:no-preference){
  .hstack .t{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
  .hstack .t:nth-child(2){animation-delay:.08s}.hstack .t:nth-child(3){animation-delay:.16s}
  @keyframes rise{from{transform:translateY(14px)}to{transform:none}}
}

/* Güven satırı */
.trust{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.trust div{display:flex;gap:12px;align-items:center;padding:16px;border-radius:var(--r);background:var(--ice-2);font-size:.9rem;min-width:0}
.trust svg{flex:none;color:var(--brand)}
.trust b{display:block;font-weight:600}
.trust span{color:var(--muted);font-size:.82rem}

/* Bölüm başlığı */
.sh{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px}
.sh h2{font-size:1.6rem}
.sh a{font-size:.9rem;color:var(--brand);font-weight:600;text-decoration:none}
.sh a:hover{text-decoration:underline}

/* Kategoriler */
.cats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.cat{display:grid;gap:10px;justify-items:center;text-decoration:none;padding:18px 10px;border-radius:var(--r);border:1px solid var(--line);transition:border-color .15s,transform .2s;font-size:.9rem;font-weight:500;text-align:center}
.cat:hover{border-color:var(--brand);transform:translateY(-2px)}
.cat .ic{width:64px;height:64px;border-radius:50%;background:var(--ice);display:grid;place-items:center;color:var(--brand)}

/* Ürün ızgarası */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 16px}
.card{display:grid;gap:10px;text-decoration:none;color:var(--ink);min-width:0;position:relative}
.card .im{aspect-ratio:1/1;max-width:100%;border-radius:var(--r);display:grid;place-items:center;position:relative;overflow:hidden;transition:transform .3s}
.card:hover .im svg{transform:scale(1.06)}
.im svg{transition:transform .35s cubic-bezier(.2,.7,.2,1);color:var(--brand)}
.badge{position:absolute;left:10px;top:10px;font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:99px;background:#fff;color:var(--ink)}
.badge.sale{background:var(--ink);color:#fff}
.badge.new{background:var(--gold);color:var(--ink)}
.card .nm{font-size:.94rem;line-height:1.35}
.card .cat-l{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.price{display:flex;gap:8px;align-items:baseline;font-variant-numeric:tabular-nums}
.price b{font-weight:600}
.price s{color:var(--muted);font-size:.86rem}
.quick{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border-radius:50%;border:0;background:#fff;color:var(--brand);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px -8px rgba(14,26,51,.4);transition:background .15s,color .15s}
.quick:hover{background:var(--brand);color:#fff}

/* Kampanya */
.camp{border-radius:var(--r-lg);background:var(--glow);color:#fff;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding:40px 44px;position:relative;overflow:hidden}
.camp::after{content:"";position:absolute;right:-60px;bottom:-120px;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.12)}
.camp h2{font-size:clamp(1.5rem,3vw,2.2rem)}
.camp p{opacity:.85;margin-top:8px;max-width:46ch}
.camp .btn{background:#fff;color:var(--brand);position:relative;z-index:1}

/* Liste */
.lhead{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.lhead h1{font-size:clamp(1.6rem,3vw,2.2rem)}
.lhead .cnt{color:var(--muted);font-size:.9rem;margin-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-size:.86rem;cursor:pointer;text-decoration:none}
.chip[aria-current="page"],.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
select{border:1px solid var(--line);border-radius:99px;padding:9px 14px;background:#fff}
.emptyres{padding:48px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* Ürün sayfası */
.crumbs{font-size:.84rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--brand)}
.pd{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:48px;align-items:start}
.gal{display:grid;gap:12px}
.gal .main{aspect-ratio:1/1;max-width:100%;border-radius:var(--r-lg);display:grid;place-items:center;position:relative}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.thumbs button{aspect-ratio:1/1;max-width:100%;border-radius:12px;border:2px solid transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.thumbs button[aria-pressed="true"]{border-color:var(--brand)}
.pinfo{display:grid;gap:20px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 130px)}
.pinfo h1{font-size:clamp(1.6rem,3vw,2.2rem)}
.pinfo .price b{font-size:1.6rem;font-family:var(--f-display);font-weight:700}
.pinfo .save{font-size:.8rem;font-weight:600;color:var(--ok);background:#e7f4ec;padding:3px 9px;border-radius:99px}
.opt{display:grid;gap:10px}
.opt label,.opt .lb{font-size:.86rem;font-weight:600}
.opt .lb span{font-weight:400;color:var(--muted)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;cursor:pointer;font-size:.88rem;display:flex;align-items:center;gap:8px}
.sw button i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.sw button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.buyrow{display:flex;gap:10px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:99px}
.step button{border:0;background:none;width:40px;height:44px;cursor:pointer;font-size:1.1rem}
.step output{min-width:28px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.buyrow .btn{flex:1}
.info{border:1px solid var(--line);border-radius:var(--r);display:grid}
.info div{display:flex;gap:12px;padding:14px 16px;font-size:.9rem;align-items:flex-start}
.info div+div{border-top:1px solid var(--line)}
.info svg{flex:none;color:var(--brand);margin-top:2px}
.info b{display:block;font-weight:600}
.info span{color:var(--muted);font-size:.86rem}
.specs{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 24px;font-size:.92rem;margin:0}
.specs dt{color:var(--muted)}
.specs dd{margin:0;font-variant-numeric:tabular-nums}

/* Sepet & sipariş */
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px;align-items:start}
.two h1{font-size:clamp(1.6rem,3vw,2.2rem);margin-bottom:20px}
.items{display:grid;border-top:1px solid var(--line)}
.it{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
.it .im{width:88px;height:88px;border-radius:12px;display:grid;place-items:center}
.it .nm{font-weight:500;text-decoration:none}
.it .vr{font-size:.84rem;color:var(--muted)}
.it .rt{display:grid;gap:8px;justify-items:end}
.it .rm{border:0;background:none;color:var(--muted);font-size:.82rem;cursor:pointer;text-decoration:underline}
.sum{background:var(--ice-2);border-radius:var(--r-lg);padding:24px;display:grid;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 130px)}
.sum h2{font-size:1.15rem}
.row{display:flex;justify-content:space-between;gap:12px;font-size:.94rem;font-variant-numeric:tabular-nums}
.row.t{font-weight:700;font-size:1.1rem;border-top:1px solid var(--line);padding-top:14px}
.free{font-size:.84rem;display:grid;gap:6px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--glow);border-radius:99px;transition:width .4s}
.mini{display:grid;gap:10px}
.mini div{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.86rem}
.mini .im{width:48px;height:48px;border-radius:10px;display:grid;place-items:center}

form.co{display:grid;gap:18px}
.fld{display:grid;gap:6px}
.fld label{font-size:.88rem;font-weight:600}
.fld label small{font-weight:400;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;width:100%;outline:none;transition:border-color .15s}
.fld select{border-radius:12px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--brand)}
.fld .hint{font-size:.8rem;color:var(--muted)}
.fld .er{font-size:.82rem;color:var(--err);display:none}
.fld.bad input,.fld.bad select{border-color:var(--err)}
.fld.bad .er{display:block}
.phone{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.phone span{padding:12px 12px;background:var(--ice-2);border-right:1px solid var(--line);font-variant-numeric:tabular-nums;color:var(--muted)}
.phone input{border:0;border-radius:0}
.fld.bad .phone{border-color:var(--err)}
.paym{display:flex;gap:14px;align-items:center;border:2px solid var(--brand);border-radius:var(--r);padding:16px;background:var(--ice-2)}
.paym .dot{width:20px;height:20px;border-radius:50%;border:6px solid var(--brand);background:#fff;flex:none}
.paym b{display:block}
.paym span{font-size:.86rem;color:var(--muted)}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}

.center{max-width:520px;margin:0 auto;text-align:center;display:grid;gap:16px;justify-items:center;padding-block:24px}
.center h1{font-size:clamp(1.6rem,3vw,2.2rem)}
.center p{color:var(--muted)}
.otp{display:flex;gap:10px;justify-content:center}
.otp input{width:56px;height:64px;text-align:center;font-size:1.5rem;font-family:var(--f-display);border:1px solid var(--line);border-radius:12px;outline:none}
.otp input:focus{border-color:var(--brand)}
.demo{font-size:.8rem;background:#fff7e6;color:#7a5200;padding:6px 12px;border-radius:99px}
.okc{width:72px;height:72px;border-radius:50%;background:var(--glow);display:grid;place-items:center;color:#fff}
.ordno{font-family:var(--f-display);font-weight:700;font-size:1.2rem;background:var(--ice);color:var(--brand);padding:8px 16px;border-radius:99px;font-variant-numeric:tabular-nums}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 14px 12px 18px;border-radius:99px;display:flex;gap:14px;align-items:center;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:70;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{white-space:nowrap}
.toast a{color:#fff;font-weight:600;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:99px;text-decoration:none;white-space:nowrap}

footer{border-top:1px solid var(--line);background:var(--ice-2);font-size:.88rem;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:24px;padding-block:40px}
.fgrid h3{font-size:.95rem;color:var(--ink);margin-bottom:10px}
.fgrid ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.fbot{border-top:1px solid var(--line);padding-block:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:1000px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .trust{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hgrid{grid-template-columns:minmax(0,1fr);padding:40px 28px}
  .hstack{height:300px}
  .hstack .t{width:140px}.hstack .t:nth-child(2){width:156px}
  .pd,.two{grid-template-columns:minmax(0,1fr);gap:28px}
  .pinfo,.sum{position:static}
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .hrow{flex-wrap:wrap;gap:12px}
  .search{order:3;flex-basis:100%;max-width:none}
  .lang button{padding:5px 7px}
  .cartbtn .lbl{display:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}
  .cats{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .cat{padding:14px 6px;font-size:.82rem}.cat .ic{width:52px;height:52px}
  .trust{grid-template-columns:minmax(0,1fr)}
  .hgrid{padding:32px 20px}
  .hstack{display:none}
  .hero::after{right:-200px;top:auto;bottom:-280px;width:400px;height:400px;opacity:.45}
  .camp{grid-template-columns:minmax(0,1fr);padding:28px 24px}
  .it{grid-template-columns:64px minmax(0,1fr);}
  .it .im{width:64px;height:64px}
  .it .rt{grid-column:2;justify-items:start;grid-auto-flow:column;justify-content:space-between;align-items:center}
  .pair{grid-template-columns:minmax(0,1fr)}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .strip .proto{display:none}
  .otp input{width:48px;height:58px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- Yönlendirme ---------- */
const app=document.getElementById("app");
function route(){
  const h=(location.hash||"#home").slice(1);
  let html,cur="";
  if(h==="shop"){html=vList();cur="shop"}
  else if(h.startsWith("c-")){S.q="";html=vList(h.slice(2));cur=h.slice(2)}
  else if(h.startsWith("p-")){html=vProduct(+h.slice(2));cur=(P.find(p=>p.id===+h.slice(2))||{}).cat}
  else if(h==="cart") html=vCart();
  else if(h==="checkout") html=vCheckout();
  else if(h==="verify") html=vVerify();
  else if(h==="done") html=vDone();
  else html=vHome();
  if(html==="")return;
  app.innerHTML=html;
  chrome(cur);
}

  const L_=L();
  document.getElementById("foot").innerHTML=`<div><a class="logo" href="#home" style="margin-bottom:10px"><svg width="26" height="26"><use href="#kmark"/></svg><span style="font-size:1.35rem">kose</span></a><p style="max-width:34ch;margin-top:10px">${t("f1s")}</p></div>
   <div><h3>${t("f2")}</h3><ul>${L_.fl.map(x=>`<li>${x}</li>`).join("")}</ul></div>
   <div><h3>${t("f3")}</h3><ul>${L_.fc.map(x=>`<li>${x}</li>`).join("")}</ul></div>
   <div><h3>${t("f4")}</h3><ul><li>+383 44 000 000</li><li>info@kose.example</li><li>Prishtinë</li></ul></div>`;
}

/* ---------- Sepet ---------- */
let toastT;
function addToCart(id,c,s,q){
  const ex=S.cart.find(i=>i.id===id&&i.c===c&&i.s===s);
  if(ex) ex.qty+=q; else S.cart.push({id,c,s,qty:q});
  save(); document.getElementById("cartN").textContent=count();
  const to=document.getElementById("toast");
  document.getElementById("toastTxt").textContent=t("added");
  document.getElementById("toastLink").textContent=t("view");
  to.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>to.classList.remove("on"),2800);
}

/* ---------- Olaylar ---------- */
document.addEventListener("click",e=>{
  const qb=e.target.closest("[data-quick]");
  if(qb){e.preventDefault();e.stopPropagation();const p=P.find(x=>x.id===+qb.dataset.quick);
    if(p.sizes){location.hash="#p-"+p.id;return} addToCart(p.id,p.colors?p.colors[0]:null,"-",1);return}
  const lb=e.target.closest(".lang button");
  if(lb){S.lang=lb.dataset.l;save();route();return}
  const h=(location.hash||"").slice(1);
  if(h.startsWith("p-")){
    const id=+h.slice(2),v=S.pv[id];if(!v)return;
    const c=e.target.closest("[data-color]"),s=e.target.closest("[data-size]"),q=e.target.closest("[data-q]"),im=e.target.closest("[data-img]");
    if(c){v.c=c.dataset.color;route();return}
    if(s){v.s=s.dataset.size;route();return}
    if(q){v.q=Math.max(1,Math.min(20,v.q+ +q.dataset.q));route();return}
    if(im){v.img=+im.dataset.img;route();return}
    if(e.target.closest("#addBtn")){addToCart(id,v.c,v.s,v.q);return}
  }
  const cq=e.target.closest("[data-cq]");
  if(cq){const it=S.cart[+cq.dataset.cq];it.qty=Math.max(1,Math.min(20,it.qty+ +cq.dataset.d));save();route();return}
  const rm=e.target.closest("[data-rm]");
  if(rm){S.cart.splice(+rm.dataset.rm,1);save();route();return}
});
document.addEventListener("change",e=>{if(e.target.id==="sort"){S.sort=e.target.value;route()}});
const qIn=document.getElementById("q");
qIn.addEventListener("input",()=>{S.q=qIn.value;const h=location.hash.slice(1);
  if(h!=="shop"){location.hash="#shop"}else route();
  setTimeout(()=>{qIn.focus()},0)});
document.addEventListener("input",e=>{if(e.target.closest("#co")){S.form[e.target.id]=e.target.value;e.target.closest(".fld")?.classList.remove("bad")}});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="co"){
    const f=S.form; ["name","phone","city","addr","note"].forEach(k=>{const el=document.getElementById(k);if(el)f[k]=el.value.trim()});
    const ph=f.phone.replace(/\D/g,"").replace(/^383/,"").replace(/^0/,"");
    const bad={name:f.name.split(/\s+/).filter(Boolean).length<2,phone:!/^4[3-9]\d{6}$/.test(ph),city:!f.city,addr:f.addr.length<5};
    let first=null;
    for(const k in bad){document.getElementById("f-"+k).classList.toggle("bad",bad[k]);if(bad[k]&&!first)first=k}
    if(first){document.getElementById(first).focus();return}
    f.phone=ph.replace(/^(\d{2})(\d{3})(\d{3})$/,"$1 $2 $3");
    S.code=String(1000+Math.floor(Math.random()*9000));
    location.hash="#verify";
  }
  if(e.target.id==="otpf"){
    const v=[0,1,2,3].map(i=>document.getElementById("o"+i).value).join("");
    if(v!==S.code){document.getElementById("otpErr").hidden=false;document.getElementById("o0").focus();return}
    const s=sub();
    S.order={no:"KS-"+String(Date.now()).slice(-6),first:S.form.name.split(" ")[0],total:s+shipCost(s),city:S.form.city};
    S.cart=[];S.code="";save();location.hash="#done";
  }
});
document.addEventListener("input",e=>{
  const m=/^o(\d)$/.exec(e.target.id||""); if(!m)return;
  e.target.value=e.target.value.replace(/\D/g,"").slice(0,1);
  if(e.target.value&&+m[1]<3)document.getElementById("o"+(+m[1]+1)).focus();
});
document.addEventListener("keydown",e=>{
  const m=/^o(\d)$/.exec(e.target.id||""); if(m&&e.key==="Backspace"&&!e.target.value&&+m[1]>0)document.getElementById("o"+(+m[1]-1)).focus();
});
let lastH=location.hash;
window.addEventListener("hashchange",()=>{route();if(!location.hash.startsWith("#shop")||lastH.startsWith("#p-"))window.scrollTo({top:0,behavior:"instant"});lastH=location.hash;
  if(location.hash==="#verify")setTimeout(()=>document.getElementById("o0")?.focus(),50)});
route();
})();
</script>
